<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galaxy Music</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #080713;
            --panel: #121126;
            --panel2: #191733;
            --line: #302b50;
            --purple: #a78bfa;
            --blue: #38bdf8;
            --text: #f4f2ff;
            --muted: #a6a2c2;
            --green: #70f0bd;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: radial-gradient(ellipse at 15% -10%, #30205a 0, transparent 42%), 
                        radial-gradient(ellipse at 95% 15%, #102c4a 0, transparent 35%), 
                        var(--bg);
            color: var(--text);
            font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .player {
            width: 100%;
            max-width: 850px;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 16px 60px #0002;
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            font-size: 2.4rem;
            letter-spacing: -0.04em;
            background: linear-gradient(100deg, var(--purple), var(--blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h2 {
            font-size: 1.1rem;
            margin: 25px 0 15px;
            color: var(--text);
            font-weight: 700;
        }

        .input {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 13px;
            border: 1px solid var(--line);
            background: #100f21;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: all .2s;
        }

        input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px #a78bfa1c;
        }

        button {
            padding: 12px 24px;
            border: 1px solid #a78bfa66;
            border-radius: 13px;
            background: #a78bfa18;
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
        }

        button:hover { background: #a78bfa35; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        #video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--line);
            margin-top: 10px;
            box-shadow: 0 8px 30px #0004;
            position: relative;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            color: var(--muted);
            font-size: 14px;
            min-height: 21px;
        }

        /* Text-Only Music List */
        #search-results {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 20px 0;
        }

        .result-card {
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px 20px;
            cursor: pointer;
            color: var(--text);
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all .2s;
            width: 100%;
        }

        .result-card:hover { 
            border-color: var(--purple); 
            background: #211c3b;
            transform: translateX(5px);
        }

        .result-card .title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        .result-card .channel {
            font-size: 13px;
            color: var(--blue);
            font-weight: 500;
        }

        #search-status { 
            color: var(--muted); 
            font-size: 13px; 
            margin: 10px 0; 
        }

        .search-actions { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            margin: 15px 0; 
        }

        .search-actions button { 
            flex: 1; 
            min-width: 160px; 
            background: linear-gradient(145deg, #17152b, #100f20);
            border-color: var(--line);
        }

        .search-actions button:hover {
            border-color: var(--purple);
        }

        .search-actions .secondary { 
            background: transparent;
            border: 1px solid var(--line);
            color: var(--muted);
        }

        .search-actions .active { 
            background: #a78bfa18; 
            border-color: var(--purple);
            color: var(--purple);
        }

        #radio-controls {
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            background: #100f21;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--line);
        }

        #radio-controls button {
            background: linear-gradient(135deg, var(--purple), var(--blue));
            color: #090817;
            border: none;
            font-weight: 800;
            padding: 10px 20px;
        }

        #radio-controls button:hover {
            filter: brightness(1.1);
        }

        #up-next {
            margin-top: 20px;
            background: #100f21;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 15px;
            display: none;
        }

        #up-next h3 {
            margin: 0 0 10px;
            font-size: 14px;
            color: var(--blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .next-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 10px;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
            cursor: pointer;
            transition: all .2s;
            border-radius: 8px;
        }
        .next-item:hover { background: #191733; transform: translateX(4px); }
        .next-item:last-child { border-bottom: none; }
        
        .next-item .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }
        
        .next-item .track-title {
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .next-item .track-channel {
            font-size: 12px;
            color: var(--muted);
        }

        #description-box {
            margin-top: 25px;
            background: #100f21;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--line);
            display: none;
        }

        #description-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--blue);
            font-size: 16px;
        }

        #description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }
    </style>
</head>

<body>

<div class="player">

    <h1>Galaxy Music</h1>
    <div class="input">
        <input id="search-query" placeholder="Search songs, artists, albums..." onkeydown="if(event.key==='Enter') searchYouTube()">
        <button onclick="searchYouTube()">Search</button>
    </div>
    <div class="search-actions">
        <button id="mix-toggle-btn" class="secondary" onclick="toggleMixMode()">🎵 Autoplay Mix: OFF</button>
    </div>
    <div id="search-status">Search music, or toggle Autoplay Mix to generate a continuous queue.</div>
    
    <!-- Text-only search results -->
    <div id="search-results"></div>

    <h2>Or play a URL / Video ID</h2>
    <div class="input">
        <input id="url" placeholder="Paste YouTube URL or Video ID..." onkeydown="if(event.key==='Enter') loadYouTube()">
        <button onclick="loadYouTube()">Play</button>
    </div>

    <div id="video"></div>

    <div id="status">
        Loading Player...
    </div>

    <div id="radio-controls">
        <button onclick="playNextRadioTrack()">⏭️ Skip</button>
        <div style="font-size: 13px; color: var(--muted);" id="queue-count">Queue: 0</div>
    </div>

    <div id="up-next">
        <h3>Up Next</h3>
        <div id="next-list"></div>
    </div>

    <div id="description-box">
        <h3>Now Playing</h3>
        <p id="description"></p>
    </div>

</div>

<script>
let player;
let mixMode = false;
let radioMode = false;
let radioQueue = [];
let radioIndex = -1;
let radioSeedTitle = "";
let radioSeedCreator = "";
let radioLoading = false;

// API Key
const YOUTUBE_API_KEY = "AIzaSyAZW0vjs9pQi1x1A9FoJMUa8unnRDuiIvM";

function toggleMixMode() {
    mixMode = !mixMode;
    const btn = document.getElementById("mix-toggle-btn");
    if (mixMode) {
        btn.textContent = "🎵 Autoplay Mix: ON";
        btn.classList.add("active");
        btn.classList.remove("secondary");
    } else {
        btn.textContent = "🎵 Autoplay Mix: OFF";
        btn.classList.remove("active");
        btn.classList.add("secondary");
        radioMode = false;
        radioQueue = [];
        radioIndex = -1;
        updateUI();
    }
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
}

function getWordsForCompare(title) {
    let str = String(title || "").toLowerCase();
    str = str.replace(/\[.*?\]|\(.*?\)/g, " ");
    str = str.replace(/\b(official|music|video|audio|lyrics?|hd|4k|mv|full|song|visualizer|remastered|topic|vevo|ft|feat|featuring|live|performance|remix|version|uncensored|unedited|long|edit|mix|radio|from|the|in|of|by|a|and|to|my|is|it|on|with|as|at|be|this|have|or|one|had|but|not|what|all|were|we|when|your|can|said|there|use|an|each|which|she|do|how|their|if|will|up|other|about|out|many|then|them|these|so|some|her|would|make|like|him|into|time|has|look|two|more|write|go|see|number|no|way|could|people|than|first|water|been|call|who|oil|its|now|find|long|down|day|did|get|come|made|may|part|v|vs|explicit)\b/g, " ");
    str = str.replace(/[^\w\s]/g, " ");
    return [...new Set(str.split(/\s+/).filter(Boolean))];
}

function isDuplicate(title, existingTitles) {
    const newWords = getWordsForCompare(title);
    if (newWords.length === 0) return false;

    for (const existingTitle of existingTitles) {
        const oldWords = getWordsForCompare(existingTitle);
        if (oldWords.length === 0) continue;

        const overlap = newWords.filter(w => oldWords.includes(w)).length;
        const ratio = overlap / Math.min(newWords.length, oldWords.length);
        
        if (ratio >= 0.7) return true;
    }
    return false;
}

function guessCreator(title, channel) {
    if (!title && !channel) return "";
    let cleaned = String(title || "")
        .replace(/\[.*?\]|\(.*?\)/g, "")
        .replace(/\b(official|lyrics?|audio|music\s*video|video|hd|4k|gameplay|review|walkthrough|tutorial|mv|vevo)\b/gi, "")
        .trim();
    
    const separators = [" - ", " – ", " — ", " | ", ": "];
    for (const sep of separators) {
        if (cleaned.includes(sep)) {
            const first = cleaned.split(sep)[0].trim();
            if (first.length > 1 && first.length < 50) return first;
        }
    }
    
    if (channel && !/topic|vevo|records|official|music/i.test(channel)) {
        return channel.replace(/VEVO$/i, "").trim();
    }
    return cleaned || channel;
}

async function searchYouTube() {
    let rawQuery = document.getElementById("search-query").value.trim();
    const status = document.getElementById("search-status");
    const results = document.getElementById("search-results");

    if (!rawQuery) {
        status.textContent = "Enter something to search for.";
        return;
    }

    // Force music context if they didn't type it
    if (!rawQuery.toLowerCase().includes("music") && !rawQuery.toLowerCase().includes("song")) {
        rawQuery += " music";
    }

    status.textContent = "Searching...";
    results.innerHTML = "";

    try {
        const url = new URL("https://www.googleapis.com/youtube/v3/search");
        url.search = new URLSearchParams({
            part: "snippet",
            type: "video",
            videoCategoryId: "10", // Category 10 is "Music"
            maxResults: "20",
            q: rawQuery,
            key: YOUTUBE_API_KEY
        }).toString();

        const response = await fetch(url.toString());
        const payload = await response.json();

        if (!response.ok || payload.error) {
            throw new Error(payload.error?.message || "API Error.");
        }

        const items = (payload.items || []).filter(item => item.id && item.id.videoId);
        if (!items.length) {
            status.textContent = "No music found.";
            return;
        }

        // Render as text-only cards
        results.innerHTML = items.map(item => {
            const snippet = item.snippet || {};
            return `<button class="result-card" data-video-id="${escapeHTML(item.id.videoId)}" data-video-title="${escapeHTML(snippet.title)}" data-channel-title="${escapeHTML(snippet.channelTitle)}">
                <span class="title">${escapeHTML(snippet.title)}</span>
                <span class="channel">${escapeHTML(snippet.channelTitle)}</span>
            </button>`;
        }).join("");

        results.querySelectorAll(".result-card").forEach(card => {
            card.addEventListener("click", () => {
                const videoId = card.dataset.videoId;
                document.getElementById("url").value = "https://www.youtube.com/watch?v=" + videoId;
                playVideoById(videoId, card.dataset.videoTitle, card.dataset.channelTitle);
            });
        });

        status.textContent = mixMode
            ? `Found ${items.length} tracks. Click to play with Autoplay Mix.`
            : `Found ${items.length} tracks. Select one to play.`;
    } catch (error) {
        console.error("[G-Tube search]", error);
        status.textContent = "Search failed: " + (error.message || String(error));
    }
}

function playVideoById(videoId, title = "", channel = "") {
    if (!player) {
        alert("Player is still loading. Please wait a second.");
        return;
    }

    fetchVideoDetails(videoId);

    if (mixMode) {
        startMusicMix(videoId, title || "Track", channel);
    } else {
        radioMode = false;
        radioQueue = [];
        radioIndex = -1;
        updateUI();
        player.loadVideoById(videoId);
        document.getElementById("status").textContent = "▶️ Playing: " + (title || videoId);
    }
}

// ==========================================
// OFFICIAL YOUTUBE MIX ENGINE
// ==========================================

async function startMusicMix(videoId, title = "Track", channel = "") {
    if (!player) return;
    radioMode = true;
    radioSeedTitle = title;
    radioSeedCreator = guessCreator(title, channel);
    radioQueue = [{ id: videoId, title: title, creator: radioSeedCreator }];
    radioIndex = 0;

    player.loadVideoById(videoId);
    updateUI();
    document.getElementById("status").textContent = "🎵 Mix initialized — discovering music...";
    
    await addRadioTracks(videoId);
}

async function addRadioTracks(seedId) {
    if (radioLoading || !radioMode) return;
    radioLoading = true;

    try {
        let candidates = [];
        
        // 1. Try YouTube's Official Mix for this video
        const mixUrl = new URL("https://www.googleapis.com/youtube/v3/playlistItems");
        mixUrl.search = new URLSearchParams({
            part: "snippet",
            playlistId: "RD" + seedId,
            maxResults: "50",
            key: YOUTUBE_API_KEY
        }).toString();

        const mixRes = await fetch(mixUrl.toString());
        const mixData = await mixRes.json();

        if (mixRes.ok && mixData.items && mixData.items.length > 0) {
            candidates = mixData.items.map(item => {
                return {
                    id: item.snippet.resourceId.videoId,
                    snippet: {
                        title: item.snippet.title,
                        channelTitle: item.snippet.videoOwnerChannelTitle || item.snippet.channelTitle
                    }
                };
            });
        } else {
            // Fallback Search
            const searchQuery = `${radioSeedCreator} music`.trim();
            const searchUrl = new URL("https://www.googleapis.com/youtube/v3/search");
            searchUrl.search = new URLSearchParams({
                part: "snippet",
                type: "video",
                videoCategoryId: "10",
                maxResults: "50",
                q: searchQuery,
                key: YOUTUBE_API_KEY
            }).toString();

            const searchRes = await fetch(searchUrl.toString());
            const searchData = await searchRes.json();
            if (!searchRes.ok) throw new Error(searchData.error?.message || "Search failed");
            
            candidates = (searchData.items || []).filter(item => item.id && item.id.videoId);
        }

        const uniqueIds = [...new Set(candidates.map(c => c.id || c.id.videoId))].filter(id => id !== seedId);

        // 2. Batch Video Details API for durations
        let durations = {};
        if (uniqueIds.length > 0) {
            const videoUrl = new URL("https://www.googleapis.com/youtube/v3/videos");
            videoUrl.search = new URLSearchParams({
                part: "contentDetails",
                id: uniqueIds.slice(0, 50).join(","),
                key: YOUTUBE_API_KEY
            }).toString();

            const vidRes = await fetch(videoUrl.toString());
            const vidData = await vidRes.json();
            if (vidRes.ok) {
                (vidData.items || []).forEach(item => {
                    durations[item.id] = parseIsoDuration(item.contentDetails?.duration);
                });
            }
        }

        // 3. Filter & Deduplicate
        let cleanCandidates = [];
        const seenTitles = radioQueue.map(t => t.title);
        const seenIds = new Set(radioQueue.map(t => t.id));
        
        const artistCounts = {};
        radioQueue.forEach(t => {
            const c = (t.creator || "").toLowerCase();
            if (c) artistCounts[c] = (artistCounts[c] || 0) + 1;
        });

        // Very strict filter for non-music content
        const nonMusicRegex = /\b(gameplay|tutorial|review|reaction|podcast|unboxing|vlog|asmr|live stream|10 hours?|24\/7|loop|jukebox|full album|compilation)\b/i;

        for (const item of candidates) {
            const videoId = item.id || item.id.videoId;
            if (!videoId || seenIds.has(videoId)) continue;

            const snippet = item.snippet || {};
            const title = snippet.title || "";
            const channel = snippet.channelTitle || "";

            if (isDuplicate(title, seenTitles)) continue;
            if (nonMusicRegex.test(title)) continue;

            const seconds = durations[videoId];
            if (seconds === undefined || seconds === 0) continue; 
            if (seconds < 60 || seconds > 900) continue; // Skip shorts and long mixes

            const creator = guessCreator(title, channel);
            const creatorLower = creator.toLowerCase();
            
            if (creatorLower && (artistCounts[creatorLower] || 0) >= 2) continue;

            seenIds.add(videoId);
            seenTitles.push(title);
            artistCounts[creatorLower] = (artistCounts[creatorLower] || 0) + 1;

            cleanCandidates.push({
                id: videoId,
                title: title,
                creator: creator
            });
        }

        // 4. Add to queue
        for (const track of cleanCandidates) {
            radioQueue.push(track);
        }

        updateUI();

    } catch (error) {
        console.error("[G-Tube mix]", error);
    } finally {
        radioLoading = false;
    }
}

function parseIsoDuration(value) {
    if (!value) return 0;
    const match = value.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!match) return 0;
    return Number(match[1] || 0) * 3600 + Number(match[2] || 0) * 60 + Number(match[3] || 0);
}

function updateUI() {
    const controls = document.getElementById("radio-controls");
    const upNext = document.getElementById("up-next");
    const nextList = document.getElementById("next-list");
    const status = document.getElementById("status");
    
    if (!radioMode) {
        if (controls) controls.style.display = "none";
        if (upNext) upNext.style.display = "none";
        return;
    }

    if (controls) controls.style.display = "flex";
    if (upNext) upNext.style.display = "block";

    const currentTrack = radioQueue[radioIndex] || radioQueue[0];
    const remaining = Math.max(0, radioQueue.length - radioIndex - 1);

    status.textContent = `▶️ Mix · Playing: "${currentTrack ? currentTrack.title : 'Unknown'}"`;
    document.getElementById("queue-count").textContent = `Queue: ${remaining}`;

    // Populate Up Next
    nextList.innerHTML = "";
    const upcoming = radioQueue.slice(radioIndex + 1, radioIndex + 6);
    
    if (upcoming.length === 0) {
        nextList.innerHTML = "<div style='color: var(--muted); font-size: 13px; padding: 10px;'>Finding more music...</div>";
    } else {
        upcoming.forEach((track, idx) => {
            const item = document.createElement("div");
            item.className = "next-item";
            item.innerHTML = `
                <div class="info">
                    <span class="track-title">${idx + 1}. ${escapeHTML(track.title)}</span>
                    <span class="track-channel">${escapeHTML(track.creator)}</span>
                </div>
                <span style="color: var(--muted); font-size: 16px;">⏵</span>
            `;
            item.onclick = () => {
                radioIndex += idx + 1;
                playNextRadioTrack();
            };
            nextList.appendChild(item);
        });
    }
}

function playNextRadioTrack() {
    if (!radioMode) return;
    radioIndex++;
    
    if (radioIndex < radioQueue.length) {
        const track = radioQueue[radioIndex];
        if (track.creator) radioSeedCreator = track.creator;
        if (track.title) radioSeedTitle = track.title;

        player.loadVideoById(track.id);
        document.getElementById("url").value = "https://www.youtube.com/watch?v=" + track.id;
        fetchVideoDetails(track.id);
        updateUI();

        if (radioQueue.length - radioIndex <= 5) {
            addRadioTracks(track.id);
        }
    } else {
        document.getElementById("status").textContent = "🎵 Queue empty. Finding more...";
        const currentSeed = radioQueue[radioQueue.length - 1] || radioQueue[0];
        addRadioTracks(currentSeed.id).then(() => {
            if (radioMode && radioIndex < radioQueue.length) {
                playNextRadioTrack();
            }
        });
    }
}

function initPlayer() {
    if (player) return;
    player = new YT.Player("video", {
        width: "100%",
        height: "100%",
        videoId: "",
        playerVars: { playsinline: 1, rel: 0, autoplay: 1 },
        events: {
            onStateChange: function (event) {
                if (event.data === YT.PlayerState.ENDED && radioMode) {
                    playNextRadioTrack();
                }
            },
            onReady: function () {
                document.getElementById("status").textContent = "Ready — search for music or paste a link.";
            },
            onError: function () {
                if (radioMode) setTimeout(playNextRadioTrack, 1500);
            }
        }
    });
}

function onYouTubeIframeAPIReady() {
    initPlayer();
}

function getVideoID(rawInput) {
    let input = (rawInput || "").trim();
    if (!input) return null;

    if (/^[a-zA-Z0-9_-]{11}$/.test(input)) {
        return input;
    }

    if (!input.startsWith("http://") && !input.startsWith("https://")) {
        input = "https://" + input;
    }

    try {
        const u = new URL(input);
        if (u.hostname.includes("youtube.com")) return u.searchParams.get("v");
        if (u.hostname === "youtu.be") return u.pathname.substring(1);
        return null;
    } catch {
        return null;
    }
}

async function fetchVideoDetails(id) {
    const descBox = document.getElementById("description-box");
    const descText = document.getElementById("description");

    try {
        const response = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
        if (!response.ok) throw new Error("Metadata failed");
        const data = await response.json();
        descText.textContent = `${data.title}\n${data.author_name}`;
        descBox.style.display = "block";
    } catch {
        descText.textContent = "Unable to retrieve details.";
        descBox.style.display = "block";
    }
}

function loadYouTube() {
    const rawInput = document.getElementById("url").value.trim();
    const id = getVideoID(rawInput);
    
    if (!id) {
        alert("Please paste a valid YouTube video URL or 11-character video ID.");
        return;
    }

    playVideoById(id);
}
</script>
