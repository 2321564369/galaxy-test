<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galaxy YouTube Player</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #080713;
            --panel: #121126;
            --panel2: #191733;
            --line: #302b50;
            --purple: #a78bfa;
            --blue: #38bdf8;
            --text: #f4f2ff;
            --muted: #a6a2c2;
            --green: #70f0bd;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: radial-gradient(ellipse at 15% -10%, #30205a 0, transparent 42%), 
                        radial-gradient(ellipse at 95% 15%, #102c4a 0, transparent 35%), 
                        var(--bg);
            color: var(--text);
            font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .player {
            width: 100%;
            max-width: 900px;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 16px 60px #0002;
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            font-size: 2.2rem;
            letter-spacing: -0.03em;
            background: linear-gradient(100deg, var(--purple), var(--blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h2 {
            font-size: 1.1rem;
            margin: 25px 0 15px;
            color: var(--text);
            font-weight: 700;
        }

        .input {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 13px;
            border: 1px solid var(--line);
            background: #100f21;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: all .2s;
        }

        input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px #a78bfa1c;
        }

        button {
            padding: 12px 24px;
            border: 1px solid #a78bfa66;
            border-radius: 13px;
            background: #a78bfa18;
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
        }

        button:hover { background: #a78bfa35; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        #video-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
            background: #000;
            border-radius: 14px;
            border: 1px solid var(--line);
            overflow: hidden;
        }

        #video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            color: var(--muted);
            font-size: 14px;
            min-height: 21px;
        }

        #search-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .result-card {
            min-width: 0;
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            color: var(--text);
            text-align: left;
            padding: 0;
            display: block;
            width: 100%;
            transition: all .2s;
        }

        .result-card:hover { 
            border-color: var(--purple); 
            transform: translateY(-2px);
            background: #211c3b;
        }

        .result-card img { 
            display: block; 
            width: 100%; 
            aspect-ratio: 16/9; 
            object-fit: cover; 
            border-bottom: 1px solid var(--line);
            background: var(--bg);
        }

        .result-card span { 
            display: block; 
            padding: 12px; 
            font-size: 13px; 
            line-height: 1.4; 
            font-weight: 600;
        }

        .result-card small {
            color: var(--muted);
            font-weight: 400;
            margin-top: 4px;
            display: block;
        }

        #search-status { 
            color: var(--muted); 
            font-size: 13px; 
            margin: 10px 0; 
        }

        #description-box {
            margin-top: 25px;
            background: #100f21;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--line);
            display: none;
        }

        #description-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--blue);
            font-size: 16px;
        }

        #description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }
    </style>
</head>

<body>

<div class="player" id="player-container">

    <h1>Galaxy YouTube</h1>
    
    <div id="search-status">Search YouTube for anything.</div>

    <div class="input">
        <input id="search-query" placeholder="Search videos, channels, topics..." onkeydown="if(event.key==='Enter') searchYouTube()">
        <button onclick="searchYouTube()">Search</button>
    </div>
    
    <div id="search-results"></div>

    <h2>Or play a URL / Video ID</h2>
    <div class="input">
        <input id="url" placeholder="Paste YouTube URL or Video ID (e.g. dQw4w9WgXcQ)" onkeydown="if(event.key==='Enter') loadYouTube()">
        <button onclick="loadYouTube()">Load</button>
    </div>

    <div id="video-container">
        <div id="video"></div>
    </div>

    <div id="status">
        Loading YouTube Player...
    </div>

    <div id="description-box">
        <h3>Video Details</h3>
        <p id="description"></p>
    </div>

</div>

<script>
let player;
const YOUTUBE_API_KEY = "AIzaSyAZW0vjs9pQi1x1A9FoJMUa8unnRDuiIvM";
const imageCache = new Map();

async function getCachedImage(url) {
    if (imageCache.has(url)) return imageCache.get(url);
    try {
        const response = await fetch(url, { mode: 'cors' });
        const blob = await response.blob();
        const objectURL = URL.createObjectURL(blob);
        imageCache.set(url, objectURL);
        return objectURL;
    } catch (e) {
        imageCache.set(url, url);
        return url;
    }
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
}

async function searchYouTube() {
    const rawQuery = document.getElementById("search-query").value.trim();
    const status = document.getElementById("search-status");
    const results = document.getElementById("search-results");

    if (!rawQuery) {
        status.textContent = "Enter something to search for.";
        return;
    }

    status.textContent = "Searching YouTube...";
    results.innerHTML = "";

    try {
        const url = new URL("https://www.googleapis.com/youtube/v3/search");
        url.search = new URLSearchParams({
            part: "snippet",
            type: "video",
            safeSearch: "moderate",
            maxResults: "20",
            q: rawQuery,
            key: YOUTUBE_API_KEY
        }).toString();

        const response = await fetch(url.toString());
        const payload = await response.json();

        if (!response.ok || payload.error) throw new Error(payload.error?.message || "API error");

        const items = (payload.items || []).filter(item => item.id && item.id.videoId);
        if (!items.length) {
            status.textContent = "No results found.";
            return;
        }

        results.innerHTML = items.map(item => {
            const snippet = item.snippet || {};
            const thumbs = snippet.thumbnails || {};
            const thumb = (thumbs.high || thumbs.medium || thumbs.default || {}).url || "";
            return '<button class="result-card" data-video-id="' + escapeHTML(item.id.videoId) +
                '" data-video-title="' + escapeHTML(snippet.title || "YouTube video") + '">' +
                '<img src="' + escapeHTML(thumb) + '" data-original="' + escapeHTML(thumb) + '" alt="">' +
                '<span>' + escapeHTML(snippet.title || "Untitled") + '<br><small>' +
                escapeHTML(snippet.channelTitle || "") + '</small></span></button>';
        }).join("");

        const imgElements = results.querySelectorAll(".result-card img");
        for (const img of imgElements) {
            const originalUrl = img.dataset.original;
            if (originalUrl) {
                const cachedUrl = await getCachedImage(originalUrl);
                if (img.src !== cachedUrl) img.src = cachedUrl;
            }
        }

        results.querySelectorAll(".result-card").forEach(card => {
            card.addEventListener("click", () => {
                const videoId = card.dataset.videoId;
                document.getElementById("url").value = "https://www.youtube.com/watch?v=" + videoId;
                playVideoById(videoId, card.dataset.videoTitle);
            });
        });

        status.textContent = "Found " + items.length + " videos.";
    } catch (error) {
        status.textContent = "Search failed: " + error.message;
    }
}

function playVideoById(videoId, title = "") {
    if (!player) {
        alert("Player is still loading.");
        return;
    }
    fetchVideoDetails(videoId);
    player.loadVideoById(videoId);
    document.getElementById("status").textContent = "▶️ Playing: " + (title || videoId);
}

function initPlayer() {
    if (player) return;
    player = new YT.Player("video", {
        width: "100%",
        height: "100%",
        videoId: "",
        playerVars: { playsinline: 1, rel: 0, autoplay: 1 },
        events: {
            onReady: function () {
                document.getElementById("status").textContent = "Ready.";
            }
        }
    });
}

function onYouTubeIframeAPIReady() { initPlayer(); }

function getVideoID(rawInput) {
    let input = (rawInput || "").trim();
    if (!input) return null;
    if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
    if (!input.startsWith("http://") && !input.startsWith("https://")) input = "https://" + input;
    try {
        const u = new URL(input);
        if (u.hostname.includes("youtube.com")) return u.searchParams.get("v");
        if (u.hostname === "youtu.be") return u.pathname.substring(1);
        return null;
    } catch { return null; }
}

async function fetchVideoDetails(id) {
    const descBox = document.getElementById("description-box");
    const descText = document.getElementById("description");
    try {
        const response = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
        if (!response.ok) throw new Error("Metadata failed");
        const data = await response.json();
        descText.textContent = `Title: ${data.title}\nAuthor: ${data.author_name}`;
        descBox.style.display = "block";
    } catch {
        descText.textContent = "Unable to retrieve details.";
        descBox.style.display = "block";
    }
}

function loadYouTube() {
    const rawInput = document.getElementById("url").value.trim();
    const id = getVideoID(rawInput);
    if (!id) { alert("Invalid URL"); return; }
    playVideoById(id);
}
</script>

<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
