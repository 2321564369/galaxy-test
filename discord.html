      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--muted);

    }

    .site-footer {

      gap: 2rem;
      align-items: center;
      color: var(--muted);
      font-size: .85rem;
    }

    .footer-left strong {
      color: var(--accent);
    }

    .footer-center {
      display: flex;
      gap: 1.5rem;
    }

    .footer-center a {

      text-decoration: none;
      opacity: .75;
    }

    .footer-center a:hover {

      color: var(--accent2);
    }

    .footer-right {
      text-align: right;
    }
    }
