<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Blast</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111827;
    font-family:Arial,Helvetica,sans-serif;
}

#launcher{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#111827,#1e293b);
}

.card{
    width:400px;
    background:#1f2937;
    padding:35px;
    border-radius:18px;
    text-align:center;
    color:white;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

h1{
    margin-bottom:10px;
    font-size:36px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    background:#3b82f6;
}

#progress{
    margin-top:25px;
    width:100%;
    height:12px;
    background:#374151;
    border-radius:999px;
    overflow:hidden;
    display:none;
}

#bar{
    width:0%;
    height:100%;
    background:#22c55e;
    transition:width .15s;
}

#status{
    margin-top:12px;
    color:#d1d5db;
    font-size:15px;
}

#unity-container{
    display:none;
    width:100%;
    height:100%;
}

#unity-canvas{
    width:100%;
    height:100%;
    background:black;
}
</style>
</head>
<body>

<div id="launcher">
    <div class="card">
        <h1>Block Blast</h1>

        <button id="play">
            ▶ Play
        </button>

        <div id="progress">
            <div id="bar"></div>
        </div>

        <div id="status"></div>
    </div>
</div>

<div id="unity-container">
    <canvas id="unity-canvas"></canvas>
</div>

<script>

const buildUrl =
"https://cdn.jsdelivr.net/gh/2321564369/galaxy-test@main/blockblast/";

const loaderUrl = buildUrl + "BlockBlast1.1-8.loader.js";

const config = {
    dataUrl: buildUrl + "BlockBlast1.1-8.data.unityweb",
    frameworkUrl: buildUrl + "BlockBlast1.1-8.framework.js.unityweb",
    codeUrl: buildUrl + "BlockBlast1.1-8.wasm.unityweb",
    companyName: "Galaxy",
    productName: "Block Blast",
    productVersion: "1.1.8"
};

document.getElementById("play").onclick = function(){

    this.disabled = true;

    document.getElementById("progress").style.display="block";
    document.getElementById("status").innerText="Loading loader...";

    const script=document.createElement("script");
    script.src=loaderUrl;

    script.onload=function(){

        if(typeof createUnityInstance==="undefined"){
            document.getElementById("status").innerText=
            "Loader loaded but createUnityInstance was not found.";
            return;
        }

        document.getElementById("status").innerText="Loading game...";

        createUnityInstance(
            document.getElementById("unity-canvas"),
            config,
            function(progress){

                document.getElementById("bar").style.width=(progress*100)+"%";
                document.getElementById("status").innerText=
                "Loading "+Math.floor(progress*100)+"%";

            }

        ).then(function(){

            document.getElementById("launcher").style.display="none";
            document.getElementById("unity-container").style.display="block";

        }).catch(function(err){

            console.error(err);
            document.getElementById("status").innerText=err;

        });

    };

    script.onerror=function(){

        document.getElementById("status").innerText=
        "Failed to load loader.js";

    };

    document.head.appendChild(script);

};

</script>

</body>
</html>
