<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Block Blast</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#111;
    overflow:hidden;
}

#unity-canvas{
    width:867px;
    height:911px;
    display:block;
    margin:auto;
}

#loading{
    color:white;
    font-family:Arial;
    text-align:center;
    margin-top:20px;
}
</style>

</head>

<body>

<div id="loading">
Loading Block Blast...
</div>

<canvas id="unity-canvas"></canvas>


<script>
const root =
"https://cdn.jsdelivr.net/gh/2321564369/galaxy-test@main/block-blast";

const build =
root + "/Build";


const github =
"https://raw.githubusercontent.com/2321564369/galaxy-test/main/block-blast/Build";

const cdn =
"https://cdn.jsdelivr.net/gh/2321564369/galaxy-test@main/block-blast/Build";


const config = {

    dataUrl:
    github + "/block-blast.data",

    codeUrl:
    github + "/block-blast.wasm",

    frameworkUrl:
    cdn + "/block-blast.framework.js",

    streamingAssetsUrl:
    "https://raw.githubusercontent.com/2321564369/galaxy-test/main/block-blast/StreamingAssets",

    companyName:"GreenLight",
    productName:"Block Blast",
    productVersion:"0.1"
};
// Intercept ALL requests for .txt files and redirect to GitHub
const originalFetch = window.fetch;
window.fetch = function(url, options) {
    if (typeof url === 'string') {
        // Check if it's a .txt file request
        if (url.includes('.txt') || url.includes('game.txt') || url.includes('setting.txt')) {
            // Extract just the filename from the URL
            const filename = url.split('/').pop();
            // Redirect to your GitHub URL
            url = `https://raw.githubusercontent.com/2321564369/galaxy-test/main/block-blast/StreamingAssets/${filename}`;
            console.log(`Redirected ${filename} request to:`, url);
        }
    }
    return originalFetch.call(this, url, options);
};

// Also intercept XHR requests
const originalOpen = XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open = function(method, url, ...rest) {
    if (typeof url === 'string') {
        if (url.includes('.txt') || url.includes('game.txt') || url.includes('setting.txt')) {
            const filename = url.split('/').pop();
            url = `https://raw.githubusercontent.com/2321564369/galaxy-test/main/block-blast/StreamingAssets/${filename}`;
            console.log(`Redirected ${filename} XHR to:`, url);
        }
    }
    return originalOpen.call(this, method, url, ...rest);
};

const canvas = document.querySelector("#unity-canvas");


let script = document.createElement("script");
script.src = build + "/block-blast.loader.js";


script.onload = () => {

    console.log("loader loaded");

    createUnityInstance(
        canvas,
        config,
        p => console.log("loading",p)
    )
    .then(() => {
        console.log("READY");
    })
    .catch(console.error);

};


document.body.appendChild(script);

</script>
</body>
</html>
