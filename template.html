<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Games Hub</title>

  <!-- ========== GALAXY THEME (SHARED) ========== -->
  <style>
    :root {
      --bg: #05010d;
      --card: #0b0620;
      --accent: #a78bfa;
      --accent2: #38bdf8;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(167,139,250,.25), transparent 60%),
        radial-gradient(800px 500px at 80% 10%, rgba(56,189,248,.2), transparent 60%),
        radial-gradient(600px 400px at 50% 80%, rgba(236,72,153,.15), transparent 60%),
        linear-gradient(180deg, #020617, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }

    /* ========== NAVBAR (SHARED ON ALL PAGES) ========== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background:
        linear-gradient(180deg, rgba(15,23,42,.75), rgba(2,6,23,.85)),
        radial-gradient(600px 200px at 10% 0%, rgba(167,139,250,.35), transparent 60%);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 20px 50px rgba(0,0,0,.7);
    }

    .nav-left {
      font-weight: 800;
      color: var(--accent);
      letter-spacing: .5px;
    }

    .nav-right {
      display: flex;
      gap: 1.25rem;
    }

    .nav-right a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      opacity: .85;
    }

    .nav-right a:hover {
      opacity: 1;
      color: var(--accent2);
    }

    /* ========== PAGE CONTENT ========== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    h1 {
      margin-top: 0;
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--muted);
      max-width: 700px;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: .85rem;
    }
  </style>
</head>
<body>

<!-- ========== NAVBAR ========== -->
<nav class="navbar">
  <div class="nav-left">🎮 HTML Games Hub</div>
  <div class="nav-right">
    <a href="index.html">Home</a>
    <a href="library.html">Library</a>
    <a href="about.html">About</a>
    <a href="settings.html">Settings</a>
  </div>
</nav>

<!-- ========== PAGE CONTENT ========== -->
<div class="container">
  <h1>Page Title</h1>
  <p>
    This is a reusable page template.
    Replace this content per page (Home, Library, About, Settings, etc).
  </p>
</div>

<footer>
  HTML Games Hub · Galaxy Theme
</footer>

</body>
</html>
