<style>
/* ---------- ABSTRACT COSMIC RESET (fixed + improved) ---------- */
:root {
  --bg-dark: #030014;
  --card-bg: rgba(8, 4, 28, 0.2);   /* opacity 0.2 */
  --accent: #c084fc;
  --accent2: #60a5fa;
  --blur-amount: 12px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
  background: var(--bg-dark);
  color: #f0f3ff;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* DYNAMIC BACKGROUND */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: var(--bg-image, radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.5), transparent 70%));
  background-size: cover;
  background-position: center;
  z-index: -2;
  transition: background-image 0.5s ease;
}

/* Light overlay – image remains vivid */
body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(3, 0, 20, 0.3);
  backdrop-filter: blur(1px);
  z-index: -1;
}

/* floating abstract orbs – subtle */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.2;
  pointer-events: none;
  z-index: -1;
  animation: drift 22s infinite alternate;
}
.orb1 { width: 500px; height: 500px; background: #a855f7; top: -150px; left: -100px; }
.orb2 { width: 600px; height: 600px; background: #3b82f6; bottom: -200px; right: -120px; animation-duration: 28s; opacity: 0.15; }
.orb3 { width: 350px; height: 350px; background: #ec489a; top: 50%; left: 80%; opacity: 0.1; }

@keyframes drift {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(50px, -40px) scale(1.1); }
}

/* header – original style */
header {
  padding: 2.5rem 1.5rem 1rem;
  text-align: center;
  position: relative;
  z-index: 5;
}
header h1 {
  font-size: 5rem;
  margin: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent2), #f472b6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 15px rgba(167,139,250,0.5);
}
header p {
  color: #cbd5e6;
  margin-top: 0.5rem;
  font-size: 1rem;
}
.version {
  color: var(--accent2);
  font-size: 0.85rem;
  opacity: 0.9;
}

/* controls: search bar + cloak */
.control-panel {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
  margin: 2rem auto 1rem;
  max-width: 800px;
  padding: 0 1rem;
}
.search-box {
  flex: 2;
  min-width: 220px;
  background: rgba(10, 6, 30, 0.7);
  backdrop-filter: blur(12px);
  border-radius: 60px;
  border: 1px solid rgba(96, 165, 250, 0.5);
  padding: 0.8rem 1.5rem;
  font-size: 1rem;
  color: white;
  outline: none;
  transition: 0.2s;
}
.search-box:focus {
  border-color: var(--accent);
  box-shadow: 0 0 18px rgba(192,132,252,0.5);
}
.counter-wrap {
  margin: 0.8rem auto;
  text-align: center;
}
#gameCounter {
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  padding: 0.4rem 1.6rem;
  border-radius: 100px;
  font-weight: 600;
  display: inline-block;
  border: 1px solid rgba(167,139,250,0.6);
}
.cloak-wrapper {
  text-align: center;
  margin: 1rem 0 2rem;
}
#cloakBtn {
  background: linear-gradient(135deg, #a78bfa, #38bdf8);
  border: none;
  border-radius: 2rem;
  padding: 0.7rem 2rem;
  font-weight: 800;
  cursor: pointer;
  color: #0a0118;
  box-shadow: 0 8px 24px rgba(167,139,250,.5);
  transition: 0.2s;
}
#cloakBtn:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
}

/* ---------- ABSTRACT GRID – WARPED, ORGANIC LAYOUT ---------- */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1rem 2rem 4rem;
  position: relative;
  z-index: 2;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 2rem 1.8rem;
  perspective: 1200px;
}

/* Each card gets unique organic distortions */
.game-card {
  background: var(--card-bg);
  backdrop-filter: blur(var(--blur-amount));
  padding: 1.2rem;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 20px 35px -10px rgba(0,0,0,0.6);
  transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  will-change: transform;
  overflow: hidden;
}

/* Random abstract shapes per card */
.game-card:nth-child(odd) {
  border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
  transform: rotate(0.8deg);
}
.game-card:nth-child(even) {
  border-radius: 30% 70% 50% 50% / 30% 40% 60% 70%;
  transform: rotate(-0.6deg);
}
.game-card:nth-child(3n) {
  border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%;
  transform: rotate(0.3deg);
}
.game-card:nth-child(5n+2) {
  border-radius: 45% 55% 65% 35% / 55% 45% 55% 45%;
  transform: rotate(-0.9deg);
}
.game-card:nth-child(7n+4) {
  border-radius: 35% 65% 40% 60% / 70% 30% 70% 30%;
}
.game-card:hover {
  transform: translateY(-12px) rotate(0deg) scale(1.02);
  border-color: var(--accent);
  box-shadow: 0 30px 45px -8px black, 0 0 0 2px rgba(192,132,252,0.5);
  border-radius: 2rem;
  transition: all 0.2s ease;
}

.game-thumb {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: inherit;
  object-fit: cover;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.15);
}
.game-card h3 {
  font-size: 1.4rem;
  font-weight: 800;
  background: linear-gradient(135deg, #fff, var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}
.game-card p {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #e2e8ff;
  text-shadow: 0 0 4px rgba(0,0,0,0.5);
}
.game-card button {
  background: linear-gradient(95deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 2rem;
  padding: 0.7rem;
  font-weight: 800;
  cursor: pointer;
  color: #020018;
  transition: 0.1s linear;
  margin-top: 0.3rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}
.game-card button:hover {
  filter: brightness(1.08);
  transform: scale(0.97);
}

/* footer */
.site-footer {
  margin-top: 4rem;
  background: rgba(2,6,23,0.7);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(167,139,250,0.4);
  padding: 2rem;
}
.footer-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}
.footer-left strong {
  color: var(--accent);
}
.footer-center button {
  background: linear-gradient(135deg, #a78bfa, #38bdf8);
  border: none;
  border-radius: 2rem;
  padding: 0.6rem 1.6rem;
  font-weight: 700;
  cursor: pointer;
  color: #020617;
  transition: 0.2s;
}
.footer-center button:hover {
  filter: brightness(1.1);
  transform: scale(0.98);
}
.footer-right {
  text-align: right;
  font-size: 0.8rem;
  color: #9ca3af;
}
@media (max-width: 700px) {
  header h1 { font-size: 3rem; }
  .games-grid { gap: 1.2rem; }
  .control-panel { flex-direction: column; }
}
.scan-line {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(0deg, rgba(0,255,255,0.02) 0px, rgba(0,255,255,0.02) 2px, transparent 2px, transparent 8px);
  pointer-events: none;
  z-index: 999;
}

/* COUNTDOWN STYLES (fixed) */
.countdown-wrapper {
  text-align: center;
  margin: 1rem auto;
  padding: 0.5rem;
}
.countdown-label {
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--accent2, #60a5fa);
  text-transform: uppercase;
  margin-bottom: 0.3rem;
}

/* Digital seven‑segment style */
.seven-segment {
  font-family: 'Courier New', 'Fira Code', 'VT323', monospace;
  font-size: 2.5rem;
  font-weight: bold;
  background: rgba(0, 0, 0, 0.7);
  display: inline-block;
  padding: 0.3rem 1rem;
  border-radius: 1rem;
  border: 1px solid var(--accent, #c084fc);
  color: var(--accent, #c084fc);
  text-shadow: 0 0 6px var(--accent2, #60a5fa);
  letter-spacing: 6px;
  backdrop-filter: blur(2px);
  box-shadow: 0 0 12px rgba(192, 132, 252, 0.3);
}

/* Responsive */
@media (max-width: 600px) {
  .seven-segment {
    font-size: 1.6rem;
    letter-spacing: 4px;
    padding: 0.2rem 0.8rem;
  }
}

/* Glow animation for digits */
@keyframes digitGlow {
  0% { text-shadow: 0 0 2px var(--accent); }
  100% { text-shadow: 0 0 10px var(--accent2); }
}
.seven-segment {
  animation: digitGlow 1.5s ease-in-out infinite alternate;
}
</style>
</head>

// ---------- ENHANCED HTML/XML LAUNCHER (runs .html like .xml) ----------
async function launchLocalGame(url) {
  const ext = url.split(".").pop().toLowerCase();
  if (ext === "xml" || ext === "html" || ext === "htm") {
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      let content = await response.text();
      
      // SMART INJECTION: if it's a full HTML document, replace entire window content
      const trimmed = content.trim();
      const isFullHtml = /^<!DOCTYPE\s+html/i.test(trimmed) || /^<html/i.test(trimmed) || (trimmed.includes("<head") && trimmed.includes("<body"));
      
      const w = window.open("about:blank", "_blank");
      if (!w) { alert("Popup blocked! Please allow popups for this site."); return; }
      
      if (isFullHtml) {
        // Preserve full HTML structure (perfect for .html games, works exactly like original)
        w.document.open();
        w.document.write(content);
        w.document.close();
      } else {
        // For XML/mini games: wrap in minimal structure
        const wrappedHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Galaxy Game</title><style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;}*{box-sizing:border-box;}</style></head><body>${content}</body></html>`;
        w.document.open();
        w.document.write(wrappedHtml);
        w.document.close();
      }
    } catch (err) {
      console.error(err);
      alert("Failed to load game. Check URL or network.");
    }
  } else {
    alert("Only .xml, .html, .htm files are supported in this launcher.");
  }
}

// Classic iframe launcher for direct game URLs
function launchURLGame(url) {
  const w = window.open("about:blank", "_blank");
  if (!w) { alert("Popup blocked! allow popups"); return; }
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Galaxy · Game</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;}iframe{border:none;width:100%;height:100%;}</style></head><body><iframe src="${url}" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-fullscreen allow-modals"></iframe></body></html>`;
  w.document.open(); w.document.write(html); w.document.close();
}

// SWF launcher (Ruffle)
function launchSWF(url, title) {
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title><style>html,body{margin:0;width:100%;height:100%;background:#000;}ruffle-player{width:100%;height:100%;}</style></head><body><script src="https://unpkg.com/@ruffle-rs/ruffle"><\/script><script>const ruffle=window.RufflePlayer.newest();const player=ruffle.createPlayer();document.body.appendChild(player);player.load({url:"${url}"});<\/script></body></html>`;
  const w = window.open("about:blank", "_blank");
  if (!w) { alert("Popup blocked!"); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

// --- RENDER GRID WITH SEARCH ---
function renderGames(filterText = "") {
  const grid = document.getElementById("gamesGrid");
  if (!grid) return;
  grid.innerHTML = "";
  const gamesList = FILE_SYSTEM[0].folder;
  let visible = 0;
  gamesList.forEach(game => {
    if (!game.title.toLowerCase().includes(filterText.toLowerCase())) return;
    visible++;
    const card = document.createElement("div");
    card.className = "game-card";
    card.innerHTML = `
      <img class="game-thumb" src="${game.image}" alt="${game.title}" loading="lazy" onerror="this.src='https://placehold.co/300x300?text=Galaxy+Game'">
      <h3>${game.title}</h3>
      <button id="${game.id}">▶ PLAY NOW</button>
    `;
    grid.appendChild(card);
    const btn = document.getElementById(game.id);
    if (btn) {
      btn.onclick = () => {
        if (game.action === "launchLocalGame") launchLocalGame(game.file);
        else if (game.action === "launchURLGame") launchURLGame(game.file);
        else if (game.action === "launchSWF") launchSWF(game.file, game.title);
        else alert(`${game.title} is currently unstable`);
      };
    }
  });
  const totalGames = gamesList.length;
  const counterEl = document.getElementById("gameCounter");
  if (filterText === "") animateCounter(counterEl, totalGames);
  else counterEl.innerHTML = `🎮 ${visible} / ${totalGames} Games (filtered)`;
}

function animateCounter(el, end, duration = 800) {
  if (!el) return;
  let start = 0;
  const startTime = performance.now();
  function step(now) {
    let p = Math.min((now - startTime) / duration, 1);
    let val = Math.floor(p * end);
    el.textContent = `🎮 ${val} Games Available`;
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = `🎮 ${end} Games Available`;
  }
  requestAnimationFrame(step);
}

// --- DIGITAL COUNTDOWN (target Dec 31 2026)---
const TARGET_DATE = "2026-06-02T03:00:00";
let countdownInterval;
function updateDigitalCountdown() {
  const target = new Date(TARGET_DATE).getTime();
  const now = new Date().getTime();
  const distance = target - now;
  if (distance < 0) {
    document.getElementById("digitalCountdown").innerHTML = "00:00:00:00";
    if (countdownInterval) clearInterval(countdownInterval);
    return;
  }
  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);
  const formatted = `${String(days).padStart(2, '0')}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  document.getElementById("digitalCountdown").innerHTML = formatted;
}
