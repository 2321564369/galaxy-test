<html lang="en">
<head>

<style>
/* ---------- ABSTRACT COSMIC RESET ---------- */
:root {
  --bg-dark: #030014;
  --card-bg: rgba(8, 4, 28, 0.2);
  --accent: #c084fc;
  --accent2: #60a5fa;
  --blur-amount: 12px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
  background: var(--bg-dark);
  color: #f0f3ff;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* DYNAMIC BACKGROUND */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: var(--bg-image, radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.5), transparent 70%));
  background-size: cover;
  background-position: center;
  z-index: -2;
  transition: background-image 0.5s ease;
}

body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(3, 0, 20, 0.3);
  backdrop-filter: blur(1px);
  z-index: -1;
}

/* floating orbs */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.2;
  pointer-events: none;
  z-index: -1;
  animation: drift 22s infinite alternate;
}
.orb1 { width: 500px; height: 500px; background: #a855f7; top: -150px; left: -100px; }
.orb2 { width: 600px; height: 600px; background: #3b82f6; bottom: -200px; right: -120px; animation-duration: 28s; opacity: 0.15; }
.orb3 { width: 350px; height: 350px; background: #ec489a; top: 50%; left: 80%; opacity: 0.1; }

@keyframes drift {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(50px, -40px) scale(1.1); }
}

/* header */
header {
  padding: 2.5rem 1.5rem 1rem;
  text-align: center;
  position: relative;
  z-index: 5;
}
header h1 {
  font-size: 5rem;
  margin: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent2), #f472b6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 15px rgba(167,139,250,0.5);
}
header p {
  color: #cbd5e6;
  margin-top: 0.5rem;
  font-size: 1rem;
}
.version {
  color: var(--accent2);
  font-size: 0.85rem;
  opacity: 0.9;
}

/* controls */
.control-panel {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
  margin: 2rem auto 1rem;
  max-width: 800px;
  padding: 0 1rem;
}
.search-box {
  flex: 2;
  min-width: 220px;
  background: rgba(10, 6, 30, 0.7);
  backdrop-filter: blur(12px);
  border-radius: 60px;
  border: 1px solid rgba(96, 165, 250, 0.5);
  padding: 0.8rem 1.5rem;
  font-size: 1rem;
  color: white;
  outline: none;
  transition: 0.2s;
}
.search-box:focus {
  border-color: var(--accent);
  box-shadow: 0 0 18px rgba(192,132,252,0.5);
}
.counter-wrap {
  margin: 0.8rem auto;
  text-align: center;
}
#gameCounter {
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(8px);
  padding: 0.4rem 1.6rem;
  border-radius: 100px;
  font-weight: 600;
  display: inline-block;
  border: 1px solid rgba(167,139,250,0.6);
}
.cloak-wrapper {
  text-align: center;
  margin: 1rem 0 2rem;
}
#cloakBtn {
  background: linear-gradient(135deg, #a78bfa, #38bdf8);
  border: none;
  border-radius: 2rem;
  padding: 0.7rem 2rem;
  font-weight: 800;
  cursor: pointer;
  color: #0a0118;
  box-shadow: 0 8px 24px rgba(167,139,250,.5);
  transition: 0.2s;
}
#cloakBtn:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
}

/* ---------- DYNAMIC GRID – NO GAPS, FIT CONTENT ---------- */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1rem 2rem 4rem;
  position: relative;
  z-index: 2;
}

/* Mosaic layout: the grid is a relatively-positioned canvas.
   Every tile is absolutely positioned with a JS-computed x/y/w/h that
   comes from recursively partitioning the whole canvas into rectangles
   (like slicing a cake) — this guarantees 100% coverage with zero gaps,
   while letting both width AND height vary per tile, randomized fresh
   on every page load. See splitLayout() / renderGames() in the script. */
.games-grid {
  position: relative;
  width: 100%;
}

.game-tile {
  position: absolute;
  padding: 0.4rem;
  box-sizing: border-box;
}

.game-tile-inner {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 12px 28px -8px rgba(0,0,0,0.6);
  background: var(--card-bg);
  backdrop-filter: blur(var(--blur-amount));
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.25s ease, border-color 0.25s ease;
}

.game-tile:hover {
  z-index: 20;
}
.game-tile:hover .game-tile-inner {
  transform: scale(1.045);
  border-color: var(--accent);
  box-shadow: 0 24px 40px -8px black, 0 0 0 2px rgba(192,132,252,0.4);
}
.game-tile:hover .tile-thumb {
  transform: scale(1.08);
}

.tile-thumb {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.tile-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(3,0,20,0.94) 0%, rgba(3,0,20,0.55) 40%, transparent 78%);
  pointer-events: none;
}

.tile-content {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 0.7rem 0.8rem;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  z-index: 2;
}

.tile-content h3 {
  font-weight: 700;
  background: linear-gradient(135deg, #fff, var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tile-content button {
  background: linear-gradient(95deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 40px;
  font-weight: 700;
  cursor: pointer;
  color: #020018;
  transition: 0.15s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tile-content button:hover {
  filter: brightness(1.08);
  transform: scale(0.97);
}

/* footer */
.site-footer {
  margin-top: 4rem;
  background: rgba(2,6,23,0.7);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(167,139,250,0.4);
  padding: 2rem;
}
.footer-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}
.footer-left strong {
  color: var(--accent);
}
.footer-center button {
  background: linear-gradient(135deg, #a78bfa, #38bdf8);
  border: none;
  border-radius: 2rem;
  padding: 0.6rem 1.6rem;
  font-weight: 700;
  cursor: pointer;
  color: #020617;
  transition: 0.2s;
}
.footer-center button:hover {
  filter: brightness(1.1);
  transform: scale(0.98);
}
.footer-right {
  text-align: right;
  font-size: 0.8rem;
  color: #9ca3af;
}
@media (max-width: 600px) {
  header h1 { font-size: 3rem; }
  .control-panel { flex-direction: column; }
}
.scan-line {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(0deg, rgba(0,255,255,0.02) 0px, rgba(0,255,255,0.02) 2px, transparent 2px, transparent 8px);
  pointer-events: none;
  z-index: 999;
}

/* COUNTDOWN */
.countdown-wrapper {
  text-align: center;
  margin: 1rem auto;
  padding: 0.5rem;
}
.countdown-label {
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--accent2, #60a5fa);
  text-transform: uppercase;
  margin-bottom: 0.3rem;
}
.seven-segment {
  font-family: 'Courier New', 'Fira Code', 'VT323', monospace;
  font-size: 2.5rem;
  font-weight: bold;
  background: rgba(0, 0, 0, 0.7);
  display: inline-block;
  padding: 0.3rem 1rem;
  border-radius: 1rem;
  border: 1px solid var(--accent, #c084fc);
  color: var(--accent, #c084fc);
  text-shadow: 0 0 6px var(--accent2, #60a5fa);
  letter-spacing: 6px;
  backdrop-filter: blur(2px);
  box-shadow: 0 0 12px rgba(192, 132, 252, 0.3);
}
@media (max-width: 600px) {
  .seven-segment {
    font-size: 1.6rem;
    letter-spacing: 4px;
    padding: 0.2rem 0.8rem;
  }
}
@keyframes digitGlow {
  0% { text-shadow: 0 0 2px var(--accent); }
  100% { text-shadow: 0 0 10px var(--accent2); }
}
.seven-segment {
  animation: digitGlow 1.5s ease-in-out infinite alternate;
}
</style>
</head>

// ---------- LAUNCHERS ----------
async function launchLocalGame(url, baseUrl) {
  const ext = url.split(".").pop().toLowerCase();
  if (ext === "xml" || ext === "html" || ext === "htm") {
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      let content = await response.text();
      const trimmed = content.trim();
      const isFullHtml = /^<!DOCTYPE\s+html/i.test(trimmed) || /^<html/i.test(trimmed) || (trimmed.includes("<head") && trimmed.includes("<body"));
      const w = window.open("about:blank", "_blank");
      if (!w) { alert("Popup blocked! Please allow popups for this site."); return; }

      // Only games that explicitly pass a baseUrl (via the optional
      // "base" field on their FILE_SYSTEM entry) get a <base> tag
      // injected — every other game's fetched HTML is untouched.
      const baseTag = baseUrl ? `<base href="${baseUrl}">` : "";

      if (isFullHtml) {
        const withBase = baseTag
          ? content.replace(/<head(\s[^>]*)?>/i, (m) => `${m}${baseTag}`)
          : content;
        w.document.open();
        w.document.write(withBase);
        w.document.close();
      } else {
        const wrappedHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8">${baseTag}<title>Galaxy Game</title><style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;}*{box-sizing:border-box;}</style></head><body>${content}</body></html>`;
        w.document.open();
        w.document.write(wrappedHtml);
        w.document.close();
      }
    } catch (err) {
      console.error(err);
      alert("Failed to load game. Check URL or network.");
    }
  } else {
    alert("Only .xml, .html, .htm files are supported in this launcher.");
  }
}

function launchURLGame(url) {
  const w = window.open("about:blank", "_blank");
  if (!w) { alert("Popup blocked! allow popups"); return; }
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Galaxy · Game</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;}iframe{border:none;width:100%;height:100%;}</style></head><body><iframe src="${url}" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-fullscreen allow-modals"></iframe></body></html>`;
  w.document.open(); w.document.write(html); w.document.close();
}

function launchSWF(url, title) {
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title><style>html,body{margin:0;width:100%;height:100%;background:#000;}ruffle-player{width:100%;height:100%;}</style></head><body><script src="https://unpkg.com/@ruffle-rs/ruffle"><\/script><script>const ruffle=window.RufflePlayer.newest();const player=ruffle.createPlayer();document.body.appendChild(player);player.load({url:"${url}"});<\/script></body></html>`;
  const w = window.open("about:blank", "_blank");
  if (!w) { alert("Popup blocked!"); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

// ---------- RANDOM MOSAIC LAYOUT ----------
// Generated fresh once per page load: a shuffled order + a random
// "weight" per game (bigger weight = bigger tile). Filtering/resizing
// reuses this same randomization so the mosaic doesn't reshuffle
// mid-session — only a fresh page load produces a new layout.
let GAME_ORDER = null;
let GAME_WEIGHTS = null;

function initRandomLayout() {
  const all = FILE_SYSTEM[0].folder;
  GAME_ORDER = [...all];
  GAME_WEIGHTS = {};
  GAME_ORDER.forEach(g => {
    const r = Math.random();
    let w;
    if (r < 0.15) w = 2.2 + Math.random() * 0.9;      // occasional big tile
    else if (r < 0.45) w = 1.3 + Math.random() * 0.5; // medium tile
    else w = 0.7 + Math.random() * 0.5;               // small tile
    GAME_WEIGHTS[g.id] = w;
  });
}

// Recursively slices a rectangle into one leaf per item — always
// covers 100% of the given area, so there is never a gap by construction.
// Splits along whichever axis is currently longer (classic "slice and
// dice" treemap heuristic), at a randomized-but-weight-balanced point.
function splitLayout(items, x, y, w, h) {
  if (items.length === 1) return [{ item: items[0], x, y, w, h }];

  const weights = items.map(it => GAME_WEIGHTS[it.id] || 1);
  const total = weights.reduce((a, b) => a + b, 0);

  let cum = 0;
  const candidates = [];
  for (let k = 1; k < items.length; k++) {
    cum += weights[k - 1];
    candidates.push({ k, diff: Math.abs(cum - total / 2) });
  }
  candidates.sort((a, b) => a.diff - b.diff);
  const pool = candidates.slice(0, Math.max(1, Math.ceil(candidates.length * 0.5)));
  const splitIndex = pool[Math.floor(Math.random() * pool.length)].k;

  const groupA = items.slice(0, splitIndex);
  const groupB = items.slice(splitIndex);
  const weightA = groupA.reduce((s, it) => s + (GAME_WEIGHTS[it.id] || 1), 0);
  const weightB = groupB.reduce((s, it) => s + (GAME_WEIGHTS[it.id] || 1), 0);
  const ratio = weightA / (weightA + weightB);

  if (w >= h) {
    const splitW = w * ratio;
    return splitLayout(groupA, x, y, splitW, h)
      .concat(splitLayout(groupB, x + splitW, y, w - splitW, h));
  } else {
    const splitH = h * ratio;
    return splitLayout(groupA, x, y, w, splitH)
      .concat(splitLayout(groupB, x, y + splitH, w, h - splitH));
  }
}

function renderGames(filterText = "") {
  const grid = document.getElementById("gamesGrid");
  if (!grid) return;
  if (!GAME_ORDER) initRandomLayout();

  const matches = GAME_ORDER.filter(g => g.title.toLowerCase().includes(filterText.toLowerCase()));
  grid.innerHTML = "";

  if (matches.length === 0) {
    grid.style.height = "auto";
    grid.innerHTML = `
      <div style="text-align:center; padding: 3rem 1rem; color:#cbd5e6;">
        <p style="font-size:1.2rem; margin-bottom:0.8rem;">😕 No games match "${filterText}"</p>
        <button id="clearSearchBtn" style="background:var(--accent);border:none;border-radius:2rem;padding:0.5rem 1.4rem;color:#020018;font-weight:700;cursor:pointer;">Clear search</button>
      </div>`;
    const clearBtn = document.getElementById("clearSearchBtn");
    if (clearBtn) {
      clearBtn.onclick = () => {
        const searchInput = document.getElementById("searchGames");
        if (searchInput) searchInput.value = "";
        renderGames("");
      };
    }
    updateCounter(filterText, 0);
    return;
  }

  const containerWidth = grid.clientWidth || (grid.parentElement && grid.parentElement.clientWidth) || 1200;

  // Fewer "columns worth" of average tile size on narrow screens keeps
  // tiles readable instead of shrinking to unreadable slivers.
  let targetCols = 6;
  if (containerWidth < 500) targetCols = 2;
  else if (containerWidth < 800) targetCols = 3;
  else if (containerWidth < 1100) targetCols = 4;

  const baseUnit = containerWidth / targetCols;
  const totalWeight = matches.reduce((s, g) => s + (GAME_WEIGHTS[g.id] || 1), 0);
  const containerHeight = (totalWeight * baseUnit * baseUnit) / containerWidth;

  grid.style.height = containerHeight + "px";

  const rects = splitLayout(matches, 0, 0, containerWidth, containerHeight);

  rects.forEach(({ item: game, x, y, w, h }) => {
    const tile = document.createElement("div");
    tile.className = "game-tile";
    tile.style.left = x + "px";
    tile.style.top = y + "px";
    tile.style.width = w + "px";
    tile.style.height = h + "px";

    const fontSize = Math.max(0.75, Math.min(1.35, w / 170)).toFixed(2);
    const btnPad = w < 130 ? "0.35rem 0.6rem" : "0.55rem 0.9rem";
    const btnFont = w < 130 ? "0.7rem" : "0.85rem";

    tile.innerHTML = `
      <div class="game-tile-inner">
        <img class="tile-thumb" src="${game.image}" alt="${game.title}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/300x300/0a0620/c084fc?text=%F0%9F%8E%AE'">
        <div class="tile-scrim"></div>
        <div class="tile-content">
          <h3 style="font-size:${fontSize}rem;">${game.title}</h3>
          <button id="${game.id}" style="padding:${btnPad}; font-size:${btnFont};">▶ PLAY</button>
        </div>
      </div>
    `;
    grid.appendChild(tile);
    const btn = document.getElementById(game.id);
    if (btn) {
      btn.onclick = (e) => {
        e.stopPropagation();
        if (game.action === "launchLocalGame") launchLocalGame(game.file, game.base);
        else if (game.action === "launchURLGame") launchURLGame(game.file);
        else if (game.action === "launchSWF") launchSWF(game.file, game.title);
        else alert(`${game.title} is currently unstable`);
      };
    }
  });

  updateCounter(filterText, matches.length);
}

function updateCounter(filterText, visible) {
  const totalGames = FILE_SYSTEM[0].folder.length;
  const counterEl = document.getElementById("gameCounter");
  if (filterText === "") animateCounter(counterEl, totalGames);
  else counterEl.innerHTML = `🎮 ${visible} / ${totalGames} Games (filtered)`;
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const searchInput = document.getElementById("searchGames");
    renderGames(searchInput ? searchInput.value : "");
  }, 150);
});

function animateCounter(el, end, duration = 800) {
  if (!el) return;
  let start = 0;
  const startTime = performance.now();
  function step(now) {
    let p = Math.min((now - startTime) / duration, 1);
    let val = Math.floor(p * end);
    el.textContent = `🎮 ${val} Games Available`;
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = `🎮 ${end} Games Available`;
  }
  requestAnimationFrame(step);
}

}

// ---------- COUNTDOWN ----------
const TARGET_DATE = "2026-06-02T03:00:00";
let countdownInterval;
function updateDigitalCountdown() {
  const target = new Date(TARGET_DATE).getTime();
  const now = new Date().getTime();
  const distance = target - now;
  if (distance < 0) {
    document.getElementById("digitalCountdown").innerHTML = "00:00:00:00";
    if (countdownInterval) clearInterval(countdownInterval);
    return;
  }
  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);
  const formatted = `${String(days).padStart(2, '0')}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  document.getElementById("digitalCountdown").innerHTML = formatted;
}
