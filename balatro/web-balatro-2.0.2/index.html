<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/2321564369/galaxy-test@main/balatro/web-balatro-2.0.2">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balatro on the Web</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      const SUPABASE_URL = "https://jlcmclwuuyzkjdfmqsre.supabase.co";
      const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";
    </script>
    <script src="lib/data.js"></script>
    <script src="lib/FileSaver.min.js"></script>
    <script src="lib/jszip.min.js"></script>
    <script src="lib/toml.js"></script>
    <script src="renderVersionList.js"></script>
    <script src="runVersion.js"></script>
    <script src="loadVersion.js"></script>
    <script src="mods.js"></script>
    <script src="patches.js"></script>
    <script src="cache.js"></script>
    <script src="build.js"></script>
    <script src="app.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Balatro</h1>

      <section>
        <h2>New Version</h2>
        <div class="options">
          <label><input type="radio" name="source" value="file" checked id="loadExeRadio"/> Load .exe or .love</label><a href="whereisexe.html">(?)</a>&nbsp;<input type="file" id="exeInput"><br>
          <label><input type="radio" name="source" value="vanilla" disabled id="loadVanillaRadio"/> Use Vanilla</label>
        </div>
        
        <h3>Mods</h3>
        <div class="addMods">
          <button id="addModDir">Add Mod Folder</button>
          <button id="clearMods">Clear Mods</button>
          <button id="useLovelyDump">Use Lovely Dump</button>
          <h4>Mods Found:</h4>
          <div class="leftAlign" id="mod-list"></div>
        </div>
        <div class="makeName">
          <label for="makeName">Name: </label><input id="makeName" placeholder="vanilla">
        </div>
        <div class="center">
          <button id="parseBtn" disabled>Build</button>
        </div>
        <progress id="progressBar" value="0" max="100" class="progress hidden"></progress>
        <div class="center">
          <p id="status">Loading Cache</p>
        </div>
      </section>

      <section>
        <h2>Player</h2>
        <div class="player-controls">
          <p id="loadedName">Nothing loaded</p>
          <button id="runBtn" disabled>Start Game</button>
          <button id="downloadCachedBtn" disabled>Download Version</button>
          <button id="makePortableBtn" disabled>Make Portable</button>
        </div>
      </section>

      <section>
  <h2>Cloud Save</h2>

  <div id="cloud-login">
    <label>
      Username:
      <input
        id="cloud-username"
        maxlength="32"
        placeholder="Username"
        autocomplete="off"
      >
    </label>

    <button id="cloud-login-button">Login</button>
  </div>

  <div id="cloud-user" class="hidden">
    Logged in as:
    <strong id="cloud-username-display"></strong>
    <button id="cloud-logout">Log Out</button>
  </div>

  <br>

  <button disabled id="save-download">
    Download Cloud Save
  </button>

  <button disabled id="save-upload">
    Upload Cloud Save
  </button>

  <button disabled id="save-delete">
    Delete Cloud Save
  </button>

  <p id="cloud-status">Not logged in</p>
</section>

      <section>
        <h2>Versions</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="versionsList">
          </tbody>
        </table>
      </section>

      <!-- Error Modal -->
      <div id="errorModal" class="modal hidden">
        <div class="modal-content">
          <span id="closeModal" class="close">&times;</span>
          <h2>Error</h2>
          <p id="errorMessage">Something went wrong.</p>
        </div>
      </div>

      <script>
        const errorModal = document.getElementById("errorModal");
        const closeModal = document.getElementById("closeModal");
        const errorMessage = document.getElementById("errorMessage");

        function showError(message) {
          errorMessage.textContent = message;
          errorModal.classList.remove("hidden");
        }

        closeModal.onclick = () => {
          errorModal.classList.add("hidden");
        };

        window.onclick = (event) => {
          if (event.target === errorModal) {
            errorModal.classList.add("hidden");
          }
        };
      </script>
    </div>
  </body>
</html>
