<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Chat</title>

<style>
:root{
  --bg:#030014;
  --card:rgba(8,4,28,0.25);
  --accent:#c084fc;
  --accent2:#60a5fa;
}
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI';
  background:var(--bg);
  color:#f0f3ff;
}

/* bg */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("https://raw.githubusercontent.com/2321564369/galaxy-test/main/81af94cb-74da-47c1-9dc1-7bfd46fd586f.jpg") center/cover;
  z-index:-2;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(3,0,20,0.3);
  backdrop-filter:blur(2px);
  z-index:-1;
}

/* orbs */
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.2;}
.orb1{width:500px;height:500px;background:#a855f7;top:-150px;left:-100px;}
.orb2{width:600px;height:600px;background:#3b82f6;bottom:-200px;right:-120px;}
.orb3{width:350px;height:350px;background:#ec489a;top:50%;left:80%;}

/* header */
header{text-align:center;padding:2rem;}
header h1{
  font-size:3rem;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

/* card */
.wrap{max-width:900px;margin:auto;padding:1rem;}
.box{
  background:var(--card);
  backdrop-filter:blur(12px);
  border-radius:40% 60% 70% 30%;
  padding:1.5rem;
  border:1px solid rgba(255,255,255,0.2);
}

/* user row */
.row{display:flex;justify-content:space-between;margin-bottom:10px;}
.user{padding:5px 10px;border-radius:20px;border:1px solid var(--accent);}
button{
  padding:6px 12px;
  border:none;
  border-radius:20px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  cursor:pointer;
}

/* chat */
.chat{
  height:350px;
  overflow-y:auto;
  background:rgba(0,0,0,0.3);
  border-radius:20px;
  padding:10px;
}

/* scrollbar */
.chat::-webkit-scrollbar{width:8px;}
.chat::-webkit-scrollbar-track{background:transparent;}
.chat::-webkit-scrollbar-thumb{
  background:linear-gradient(var(--accent),var(--accent2));
  border-radius:10px;
}

/* message */
.msg{
  margin-bottom:10px;
  padding:8px;
  border-radius:15px;
  background:rgba(255,255,255,0.05);
}

/* only new messages animate */
.msg.new{
  animation:fadeIn .35s ease;
}

/* animation */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

/* input */
.input{display:flex;margin-top:10px;gap:10px;}
input{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:1px solid var(--accent2);
  background:rgba(0,0,0,0.6);
  color:white;
}
</style>
</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<header><h1>Galaxy Chat</h1></header>

<div class="wrap">
<div class="box">

<div class="row">
<div class="user">💬 <span id="u"></span></div>
<button onclick="setName()">change</button>
</div>

<div id="c" class="chat"></div>

<div class="input">
<input id="i" placeholder="type message">
<button onclick="send()">Send</button>
</div>

</div>
</div>

<script>
// token
const A = "nwn<sFwSJF]R8NMNogT~=7znEN";
const B = "\\Okwvh|F7E^Qw48\\56LKFY;8woopl<rnQc<{nROlJ\\u";
const C = "|kP4EV;]Y:E55cxetcfylxmk";

let lastLen = 0;
// decode
function k(){
  let s=A+B+C;
  s=s.split('').reverse().join('');
  let o='';
  for(let i=0;i<s.length;i++){
    o+=String.fromCharCode(s.charCodeAt(i)-4);
  }
  return o;
}

const X=k();

// config
const O="2321564369";
const R="galaxy-test";
const F="messages.json";

// dom
const c=document.getElementById("c");
const i=document.getElementById("i");
const u=document.getElementById("u");

// user
let n=localStorage.getItem("n")||prompt("name")||"user";
localStorage.setItem("n",n);
u.textContent=n;

function setName(){
  let v=prompt("new name",n);
  if(v){n=v;localStorage.setItem("n",n);u.textContent=n;}
}

// api
function p(){
  return `https://api.github.com/repos/${O}/${R}/contents/${F}`;
}

// get
async function g(){
  const r=await fetch(p(),{headers:{Authorization:`token ${X}`}});
  if(r.status===404)return{m:[],s:null};
  const d=await r.json();
  return{m:JSON.parse(atob(d.content)),s:d.sha};
}

// update
async function w(m,s){
  const e=btoa(unescape(encodeURIComponent(JSON.stringify(m))));
  await fetch(p(),{
    method:"PUT",
    headers:{
      Authorization:`token ${X}`,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({message:"c",content:e,sha:s,branch:"main"})
  });
}

// send
async function send(){
  if(!i.value)return;
  let {m,s}=await g();
  m.push({u:n,t:i.value,d:Date.now()});
  await w(m,s);
  i.value="";
  load();
}

// render
function r(m){
  if(m.length === lastLen) return;

  const isFirstLoad = lastLen === 0;
  lastLen = m.length;

  c.innerHTML = m.map((x, idx)=>{
    let t = new Date(x.d).toLocaleTimeString();

    // only animate new messages
    const anim = (!isFirstLoad && idx >= m.length - 1)
      ? "msg new"
      : "msg";

    return `<div class="${anim}">
      <b>${x.u}</b> (${t})<br>${x.t}
    </div>`;
  }).join("");

  c.scrollTop = c.scrollHeight;
}

// load
async function load(){
  let {m}=await g();
  r(m);
}

setInterval(load,3000);
load();

i.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>

</body>
</html>
