<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Chat</title>

<style>
:root{
  --bg:#030014;
  --card:rgba(8,4,28,0.25);
  --accent:#c084fc;
  --accent2:#60a5fa;
}
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Segoe UI';
  background:var(--bg);
  color:#f0f3ff;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("https://raw.githubusercontent.com/2321564369/galaxy-test/main/81af94cb-74da-47c1-9dc1-7bfd46fd586f.jpg") center/cover;
  z-index:-2;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(3,0,20,0.3);
  backdrop-filter:blur(2px);
  z-index:-1;
}

.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.2;}
.orb1{width:500px;height:500px;background:#a855f7;top:-150px;left:-100px;}
.orb2{width:600px;height:600px;background:#3b82f6;bottom:-200px;right:-120px;}
.orb3{width:350px;height:350px;background:#ec489a;top:50%;left:80%;}

header{text-align:center;padding:2rem;}
header h1{
  font-size:100px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

.wrap{max-width:900px;margin:auto;padding:1rem;}
.box{
  background:var(--card);
  backdrop-filter:blur(12px);
  border-radius:40% 60% 70% 30%;
  padding:1.5rem;
  border:1px solid rgba(255,255,255,0.2);
}

.row{display:flex;justify-content:space-between;margin-bottom:10px;}
.user{padding:5px 10px;border-radius:20px;border:1px solid var(--accent);}
button{
  padding:6px 12px;
  border:none;
  border-radius:20px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  cursor:pointer;
  color:white;
  font-weight:bold;
  transition:transform 0.2s;
}
button:hover{transform:scale(1.05);}

.chat{
  height:350px;
  overflow-y:auto;
  background:rgba(0,0,0,0.3);
  border-radius:20px;
  padding:10px;
}

.chat::-webkit-scrollbar{width:8px;}
.chat::-webkit-scrollbar-track{background:transparent;}
.chat::-webkit-scrollbar-thumb{
  background:linear-gradient(var(--accent),var(--accent2));
  border-radius:10px;
}

.msg{
  margin-bottom:10px;
  padding:8px 12px;
  border-radius:15px;
  background:rgba(255,255,255,0.05);
  border-left: 3px solid var(--accent);
  word-wrap:break-word;
}

.msg.own {
  border-left-color: var(--accent2);
  background: rgba(96, 165, 250, 0.1);
}

.msg.system {
  border-left-color: #fbbf24;
  background: rgba(251, 191, 36, 0.1);
  text-align: center;
  color: #fbbf24;
}

.msg.error {
  border-left-color: #ef4444;
  background: rgba(239, 68, 68, 0.1);
  color: #ef4444;
}

.msg.new{
  animation:fadeIn .35s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

.msg-user {
  color: var(--accent);
  font-weight:bold;
}

.msg-time {
  font-size: 0.8em;
  opacity: 0.6;
  margin-left: 8px;
}

.msg-text {
  margin-top: 4px;
}

.input{display:flex;margin-top:10px;gap:10px;}
input{
  flex:1;
  padding:10px 15px;
  border-radius:20px;
  border:1px solid var(--accent2);
  background:rgba(0,0,0,0.6);
  color:white;
  outline: none;
  transition: border-color 0.3s;
}
input:focus {
  border-color: var(--accent);
}

.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 5px 10px;
  margin-top: 10px;
  font-size: 0.8em;
  opacity: 0.7;
}

.status-bar .online {
  color: #4ade80;
}

.status-bar .offline {
  color: #f87171;
}
</style>
</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<header><h1>Galaxy Chat</h1></header>

<div class="wrap">
<div class="box">

<div class="row">
<div class="user">💬 <span id="u"></span></div>
<button onclick="setName()">Change Name</button>
</div>

<div id="c" class="chat"></div>

<div class="input">
<input id="i" placeholder="Type message..." maxlength="500">
<button onclick="send()">Send</button>
</div>

<div class="status-bar">
  <span id="status">🟢 Connected</span>
  <span id="msgCount">0 messages</span>
</div>

</div>
</div>

<script>


const A = "fjN<q9UETGO:8YY\\WY=jJ6oTusWhmuoS{";
const B = "M~u~MXrVWvUz~4{E8OTr:oRZMwc^7hhue:8^6]=4EV;]";
const C = "Y:E55cxetcfylxmk";

function getToken() {
    let combined = A + B + C;
    combined = combined.split('').reverse().join('');
    let token = '';
    for (let i = 0; i < combined.length; i++) {
        token += String.fromCharCode(combined.charCodeAt(i) - 4);
    }
    return token;
}

const GITHUB_TOKEN = getToken();

// Verify token in console
console.log('Token length:', GITHUB_TOKEN.length);
console.log('Token starts with:', GITHUB_TOKEN.substring(0, 20));

const O = "2321564369";
const R = "galaxy-test";
const F = "messages.json";

const c = document.getElementById("c");
const i = document.getElementById("i");
const u = document.getElementById("u");
const statusEl = document.getElementById("status");
const msgCountEl = document.getElementById("msgCount");

let lastLen = 0;
let n = localStorage.getItem("n") || prompt("Enter your name:") || "user";
localStorage.setItem("n", n);
u.textContent = n;

function setName() {
  let v = prompt("New name:", n);
  if (v && v.trim()) {
    n = v.trim();
    localStorage.setItem("n", n);
    u.textContent = n;
  }
}

function getApiUrl() {
  return `https://api.github.com/repos/${O}/${R}/contents/${F}?t=${Date.now()}`;
}

async function getMessages() {
  try {
    const response = await fetch(getApiUrl(), {
      headers: {
        'Authorization': `token ${GITHUB_TOKEN}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    
    if (response.status === 404) {
      return { messages: [], sha: null };
    }
    
    if (response.status === 401) {
      statusEl.innerHTML = '🔴 Token Invalid!';
      statusEl.className = 'offline';
      c.innerHTML = `<div class="msg error">❌ Invalid GitHub token. Please check your token.</div>`;
      return { messages: [], sha: null };
    }
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    const data = await response.json();
    if (!data.content) {
      return { messages: [], sha: null };
    }
    
    const content = atob(data.content);
    const messages = JSON.parse(content);
    return { messages: messages, sha: data.sha };
  } catch (error) {
    console.error('Error fetching messages:', error);
    statusEl.innerHTML = '🔴 Error';
    statusEl.className = 'offline';
    return { messages: [], sha: null };
  }
}

async function saveMessages(messages, sha) {
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(messages))));
    const response = await fetch(getApiUrl(), {
      method: "PUT",
      headers: {
        'Authorization': `token ${GITHUB_TOKEN}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify({
        message: "Update chat messages",
        content: content,
        sha: sha,
        branch: "main"
      })
    });
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    return await response.json();
  } catch (error) {
    console.error('Error saving messages:', error);
    throw error;
  }
}

async function send() {
  if ("Notification" in window && Notification.permission !== "granted") {
    await Notification.requestPermission();
  }

  const text = i.value.trim();
  if (!text) return;

  try {
    let { messages, sha } = await getMessages();

    // Commands
    if (text.toLowerCase() === "wipe_chat" || text.toLowerCase() === "/clear") {
      if (confirm('Clear all messages?')) {
        await saveMessages([], sha);
        c.innerHTML = `<div class="msg system">🗑️ Chat cleared by ${n}</div>`;
        lastLen = 0;
        i.value = "";
        msgCountEl.textContent = '0 messages';
        statusEl.innerHTML = '🟢 Cleared';
      }
      return;
    }

    if (text.toLowerCase() === "/users" || text.toLowerCase() === "/who") {
      const users = [...new Set(messages.map(msg => msg.u))];
      c.innerHTML += `<div class="msg system">👥 Users: ${users.join(', ') || 'No users yet'}</div>`;
      c.scrollTop = c.scrollHeight;
      i.value = "";
      return;
    }

    messages.push({ u: n, t: text, d: Date.now() });
    await saveMessages(messages, sha);
    i.value = "";
    await loadMessages();
    
  } catch (error) {
    console.error('Send error:', error);
    c.innerHTML += `<div class="msg error">❌ Failed to send message: ${error.message}</div>`;
    c.scrollTop = c.scrollHeight;
  }
}

function renderMessages(messages) {
  if (!messages || messages.length === 0) {
    c.innerHTML = `<div class="msg system">💬 No messages yet. Say hello!</div>`;
    msgCountEl.textContent = '0 messages';
    return;
  }

  const isFirstLoad = lastLen === 0;
  const newMessages = messages.slice(lastLen);
  lastLen = messages.length;

  c.innerHTML = messages.map((msg, idx) => {
    const time = new Date(msg.d).toLocaleTimeString();
    const isNew = !isFirstLoad && idx >= messages.length - newMessages.length;
    const isOwn = msg.u === n;
    
    return `<div class="msg ${isNew ? 'new' : ''} ${isOwn ? 'own' : ''}">
      <span class="msg-user">${escapeHtml(msg.u)}</span>
      <span class="msg-time">${time}</span>
      <div class="msg-text">${escapeHtml(msg.t)}</div>
    </div>`;
  }).join("");

  c.scrollTop = c.scrollHeight;
  msgCountEl.textContent = `${messages.length} messages`;
  statusEl.innerHTML = '🟢 Connected';
  statusEl.className = 'online';

  // Notifications for new messages
  if (!isFirstLoad && "Notification" in window && Notification.permission === "granted" && document.hidden) {
    newMessages.forEach(msg => {
      if (msg.u !== n) {
        new Notification(`${msg.u} says:`, {
          body: msg.t,
          icon: '💬'
        });
      }
    });
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function loadMessages() {
  try {
    const { messages } = await getMessages();
    renderMessages(messages);
  } catch (error) {
    console.error('Load error:', error);
    statusEl.innerHTML = '🔴 Error';
    statusEl.className = 'offline';
  }
}

// Auto-refresh every 3 seconds
setInterval(loadMessages, 3000);
loadMessages();

// Enter key to send
i.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// Connection status
window.addEventListener('online', () => {
  statusEl.innerHTML = '🟢 Online';
  statusEl.className = 'online';
  loadMessages();
});

window.addEventListener('offline', () => {
  statusEl.innerHTML = '🔴 Offline';
  statusEl.className = 'offline';
});

console.log('💬 Galaxy Chat loaded!');
console.log('👤 User:', n);
console.log('📡 Using GitHub API with scrambled token');
console.log('💡 Commands: /clear, /users');
console.log('✅ Token unscrambled successfully!');
</script>

</body>
</html>
