<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Hollow Knight · Local Launcher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .launcher-panel {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #4c9aff;
        }
        .file-row {
            margin: 16px 0;
            text-align: left;
        }
        .file-row label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #ccc;
        }
        .file-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .file-input-wrapper input[type="text"] {
            flex: 1;
            padding: 10px;
            background: #3a3a3a;
            border: 1px solid #555;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            cursor: default;
        }
        .file-input-wrapper button {
            padding: 10px 16px;
            background: #4c9aff;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .file-input-wrapper button:hover {
            background: #3a7fd4;
        }
        .status-badge {
            display: inline-block;
            margin-left: 10px;
            font-size: 13px;
        }
        .ready { color: #6bff6b; }
        .missing { color: #ff6b6b; }
        #launchBtn {
            margin-top: 30px;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            background: #6bff6b;
            color: #1a1a1a;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        #launchBtn:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
        }
        #launchBtn:not(:disabled):hover {
            background: #4fe04f;
        }
        .game-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
        }
        #loading-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font: 24px Arial;
            z-index: 100;
        }
        #unity-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #fps-graph {
            position: fixed;
            top: 12px;
            left: 12px;
            width: 200px;
            height: 70px;
            background: rgba(0,0,0,0.8);
            border-radius: 6px;
            padding: 10px;
            z-index: 9999;
            display: none; /* shown after launch */
        }
        #fps-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .savebtn {
            position: fixed;
            top: 12px;
            right: 12px;
            padding: 10px 18px;
            cursor: pointer;
            background: rgba(50,50,50,0.85);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font: 14px Arial;
            z-index: 9999;
        }
        .savebtn:hover {
            background: rgba(70,70,70,0.95);
        }
    </style>
</head>
<body>

<!-- Launcher UI -->
<div id="launcherUI" class="launcher-panel">
    <h2>⚡ Hollow Knight · Local Launcher</h2>
    <p style="margin-bottom: 20px; color: #aaa;">Select the four game files from your device</p>

    <div class="file-row">
        <label>📦 Data File (hktruffled.data)</label>
        <div class="file-input-wrapper">
            <input type="text" id="dataPath" readonly placeholder="Click Browse...">
            <button id="browseData">Browse</button>
            <span id="dataStatus" class="status-badge missing">❌</span>
        </div>
    </div>

    <div class="file-row">
        <label>⚙️ WASM File (hktruffled.wasm)</label>
        <div class="file-input-wrapper">
            <input type="text" id="wasmPath" readonly placeholder="Click Browse...">
            <button id="browseWasm">Browse</button>
            <span id="wasmStatus" class="status-badge missing">❌</span>
        </div>
    </div>

    <div class="file-row">
        <label>📜 Loader Script (hktruffled.loader.js)</label>
        <div class="file-input-wrapper">
            <input type="text" id="loaderPath" readonly placeholder="Click Browse...">
            <button id="browseLoader">Browse</button>
            <span id="loaderStatus" class="status-badge missing">❌</span>
        </div>
    </div>

    <div class="file-row">
        <label>🧩 Framework Script (hktruffled.framework.js)</label>
        <div class="file-input-wrapper">
            <input type="text" id="frameworkPath" readonly placeholder="Click Browse...">
            <button id="browseFramework">Browse</button>
            <span id="frameworkStatus" class="status-badge missing">❌</span>
        </div>
    </div>

    <button id="launchBtn" disabled>🚀 Launch Game</button>
    <p style="margin-top: 12px; font-size: 13px; color: #888;">All files must be selected before launching.</p>
</div>

<!-- Game UI (hidden initially) -->
<div id="gameUI" class="game-ui">
    <div id="loading-text">Initializing...</div>
    <canvas id="unity-canvas"></canvas>
    <div id="fps-graph"><canvas id="fps-canvas"></canvas></div>
</div>

<script>
    (function() {
        "use strict";

        // ---------- DOM Elements ----------
        const launcherUI = document.getElementById('launcherUI');
        const gameUI = document.getElementById('gameUI');
        const launchBtn = document.getElementById('launchBtn');
        const loadingText = document.getElementById('loading-text');
        const canvas = document.getElementById('unity-canvas');
        const fpsGraph = document.getElementById('fps-graph');
        const fpsCanvas = document.getElementById('fps-canvas');

        // File inputs
        const dataPath = document.getElementById('dataPath');
        const wasmPath = document.getElementById('wasmPath');
        const loaderPath = document.getElementById('loaderPath');
        const frameworkPath = document.getElementById('frameworkPath');
        const dataStatus = document.getElementById('dataStatus');
        const wasmStatus = document.getElementById('wasmStatus');
        const loaderStatus = document.getElementById('loaderStatus');
        const frameworkStatus = document.getElementById('frameworkStatus');

        // Buttons
        const browseData = document.getElementById('browseData');
        const browseWasm = document.getElementById('browseWasm');
        const browseLoader = document.getElementById('browseLoader');
        const browseFramework = document.getElementById('browseFramework');

        // File objects storage
        let dataFile = null, wasmFile = null, loaderFile = null, frameworkFile = null;
        let dataUrl = null, wasmUrl = null, loaderScriptUrl = null;

        // ---------- FPS Counter (always visible once started) ----------
        fpsCanvas.width = 180; fpsCanvas.height = 50;
        const ctx = fpsCanvas.getContext('2d');
        let lft = performance.now(), fr = 0, fps = 60;
        const fh = [], ml = 90;
        let fpsAnimFrame = null;
        let sb = null; // save button

        function uf() {
            const nt = performance.now(), dt = (nt - lft) / 1000;
            lft = nt;
            fps = dt > 0 ? 1 / dt : 60;
            fr++;
            if (fr % 3 === 0) {
                fh.push(fps);
                if (fh.length > ml) fh.shift();
                ctx.clearRect(0, 0, 180, 50);
                for (let i = 0; i < fh.length; i++) {
                    const f = fh[i], h = Math.min(f / 60, 1) * 35,
                          c = f > 50 ? '#0f0' : f > 30 ? '#fa0' : '#f33';
                    ctx.fillStyle = c;
                    ctx.fillRect(i * 2, 50 - h, 1.8, h);
                }
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 13px monospace';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 4;
                ctx.fillText(Math.round(fps) + ' FPS', 6, 16);
                ctx.shadowBlur = 0;
            }
            fpsAnimFrame = requestAnimationFrame(uf);
        }

        // ---------- Utility: Create object URL from File ----------
        function createFileUrl(file) {
            return URL.createObjectURL(file);
        }

        // ---------- Update UI based on selected files ----------
        function updateLaunchButton() {
            const allReady = dataFile && wasmFile && loaderFile && frameworkFile;
            launchBtn.disabled = !allReady;
        }

        function setFileStatus(element, status, file) {
            if (file) {
                element.textContent = '✅';
                element.className = 'status-badge ready';
            } else {
                element.textContent = '❌';
                element.className = 'status-badge missing';
            }
        }

        // ---------- File picker handlers ----------
        function setupFilePicker(button, pathInput, statusEl, fileSetter, accept) {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = accept;
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);

            button.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const file = fileInput.files[0];
                if (file) {
                    fileSetter(file);
                    pathInput.value = file.name;
                    setFileStatus(statusEl, true, file);
                    updateLaunchButton();
                } else {
                    fileSetter(null);
                    pathInput.value = '';
                    setFileStatus(statusEl, false, null);
                    updateLaunchButton();
                }
            });
        }

        setupFilePicker(browseData, dataPath, dataStatus, (f) => { dataFile = f; }, '.data,.bin,application/octet-stream');
        setupFilePicker(browseWasm, wasmPath, wasmStatus, (f) => { wasmFile = f; }, '.wasm,application/wasm');
        setupFilePicker(browseLoader, loaderPath, loaderStatus, (f) => { loaderFile = f; }, '.js,application/javascript');
        setupFilePicker(browseFramework, frameworkPath, frameworkStatus, (f) => { frameworkFile = f; }, '.js,application/javascript');

        // ---------- Launch Game ----------
        launchBtn.addEventListener('click', async () => {
            if (!dataFile || !wasmFile || !loaderFile || !frameworkFile) return;

            // Hide launcher, show game UI
            launcherUI.style.display = 'none';
            gameUI.style.display = 'block';
            loadingText.textContent = 'Preparing files...';

            // Create object URLs
            dataUrl = createFileUrl(dataFile);
            wasmUrl = createFileUrl(wasmFile);
            const frameworkUrl = createFileUrl(frameworkFile);
            loaderScriptUrl = createFileUrl(loaderFile);

            // Resize canvas
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Load framework script first (Unity loader expects it to be present)
            loadingText.textContent = 'Loading framework...';
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = frameworkUrl;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });

            // Now load loader script
            loadingText.textContent = 'Loading Unity loader...';
            const loaderScript = document.createElement('script');
            loaderScript.src = loaderScriptUrl;
            loaderScript.onload = () => {
                // ChromeOS fix
                const originalCreate = window.createUnityInstance;
                window.createUnityInstance = function(canvas, config, onProgress) {
                    config.webglContextAttributes = { premultipliedAlpha: false };
                    return originalCreate(canvas, config, onProgress);
                };

                loadingText.textContent = 'Starting Unity...';
                createUnityInstance(canvas, {
                    dataUrl: dataUrl,
                    frameworkUrl: frameworkUrl,   // already loaded, but needed?
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: '',        // none
                    companyName: 'Team Cherry',
                    productName: 'Hollow Knight',
                    productVersion: '1.0'
                }, (progress) => {
                    loadingText.textContent = `Unity: ${Math.round(progress * 100)}%`;
                }).then(() => {
                    loadingText.remove();
                    // Add save download button
                    addSaveButton();
                    // Show FPS graph and start animation
                    fpsGraph.style.display = 'block';
                    uf();
                }).catch(err => {
                    loadingText.textContent = 'Error: ' + err.message;
                    console.error(err);
                });
            };
            loaderScript.onerror = () => {
                loadingText.textContent = 'Failed to load loader script.';
            };
            document.body.appendChild(loaderScript);
        });

        // ---------- Save Download ----------
        function addSaveButton() {
            sb = document.createElement('button');
            sb.className = 'savebtn';
            sb.textContent = 'download save';
            sb.onclick = sdl;
            document.body.appendChild(sb);
        }
        function odb(n) {
            return new Promise((ok, bd) => {
                const r = indexedDB.open(n);
                r.onsuccess = () => ok(r.result);
                r.onerror = () => bd(r.error);
            });
        }
        function ga(d, s) {
            return new Promise((ok, bd) => {
                const t = d.transaction([s], 'readonly'),
                      st = t.objectStore(s),
                      r = st.getAll();
                r.onsuccess = () => ok(r.result);
                r.onerror = () => bd(r.error);
            });
        }
        async function sdl() {
            try {
                const dbs = await indexedDB.databases();
                let sv = {}, fd = false;
                for (const inf of dbs) {
                    const db = await odb(inf.name);
                    for (const st of db.objectStoreNames) {
                        try {
                            const dt = await ga(db, st);
                            if (dt && dt.length > 0) {
                                const fx = dt.map(it => {
                                    if (it.contents && it.contents instanceof Uint8Array) {
                                        return { ...it, contents: Array.from(it.contents) };
                                    }
                                    return it;
                                });
                                sv[`${inf.name}/${st}`] = fx;
                                fd = true;
                            }
                        } catch (e) {}
                    }
                    db.close();
                }
                if (!fd) { alert('No save found'); return; }
                const js = JSON.stringify(sv),
                      bl = new Blob([js], { type: 'application/octet-stream' }),
                      u = URL.createObjectURL(bl),
                      a = document.createElement('a');
                a.href = u;
                a.download = 'hk_save.dat';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(u);
            } catch (e) {
                alert('Download failed: ' + e.message);
            }
        }

        // Cleanup object URLs on page unload
        window.addEventListener('beforeunload', () => {
            if (dataUrl) URL.revokeObjectURL(dataUrl);
            if (wasmUrl) URL.revokeObjectURL(wasmUrl);
            if (loaderScriptUrl) URL.revokeObjectURL(loaderScriptUrl);
            if (fpsAnimFrame) cancelAnimationFrame(fpsAnimFrame);
        });
    })();
</script>
</body>
</html>
