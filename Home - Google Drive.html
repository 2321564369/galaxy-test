<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dynamic Season & Episode Selector</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  #playerContainer {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 9999;
  }

  #playerIframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  #backBtn {
    position: absolute;
    top: 15px;
    left: 15px;
    width: 40px;
    height: 40px;
    cursor: pointer;
    z-index: 10000;
  }

  select {
    font-size: 20px;
    padding: 10px 15px;
    margin-right: 15px;
  }
</style>
</head>
<body>

<label style="font-size:22px;">Season:</label>
<select id="seasonSelect" onchange="updateEpisodes()">
  <option value="">Select a season...</option>
  <option value="1">Season 1</option>
  <option value="2">Season 2</option>
  <option value="3">Season 3</option>
</select>

<label style="font-size:22px;">Episode:</label>
<select id="episodeSelect" onchange="openEpisode()" disabled>
  <option value="">Select a season first...</option>
</select>

<div id="playerContainer">
  <img id="backBtn" src="back.png" onclick="closePlayer()">
  <iframe id="playerIframe" allowfullscreen></iframe>
</div>

<script>
// Total episodes per season
const episodesPerSeason = {
  1: 52,  // Season 1 episodes
  2: 52,   // Season 2 episodes
  3: 50   // Season 3 episodes
};

// Base URL
const baseURL = "https://111movies.com/tv/82728";

function updateEpisodes() {
  const season = document.getElementById("seasonSelect").value;
  const episodeSelect = document.getElementById("episodeSelect");

  episodeSelect.innerHTML = "";

  if (!season) {
    episodeSelect.disabled = true;
    episodeSelect.innerHTML = "<option>Select a season first...</option>";
    return;
  }

  episodeSelect.disabled = false;
  episodeSelect.innerHTML = "<option value=''>Select an episode...</option>";

  const totalEpisodes = episodesPerSeason[season];

  for (let i = 1; i <= totalEpisodes; i++) {
    const opt = document.createElement("option");
    opt.value = `${baseURL}/${season}/${i}`;
    opt.textContent = "Episode " + i;
    episodeSelect.appendChild(opt);
  }
}

function openEpisode() {
  const url = document.getElementById("episodeSelect").value;
  if (!url) return;

  document.getElementById("playerIframe").src = url;
  document.getElementById("playerContainer").style.display = "block";
}

function closePlayer() {
  document.getElementById("playerContainer").style.display = "none";
  document.getElementById("playerIframe").src = "";
  document.getElementById("episodeSelect").value = "";
}
</script>

</body>
</html>
