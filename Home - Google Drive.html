<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bluey</title>
<style>
/* Full page background with fade from left */
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  color: white;
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background image fade using pseudo-element */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('https://assets-prd.ignimgs.com/2023/11/22/bluey-thumb-1700628294058.png') no-repeat center center;
  background-size: cover;
  z-index: -1;

  /* Fade from left - adjust start/end percentages */
  -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-size: cover;
  mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
  mask-repeat: no-repeat;
  mask-size: cover;
}

/* Header with logo */
header {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  background: rgba(0, 0, 0, 0.5);
}

header img {
  height: 50px;
  margin-right: 15px;
}

header h1 {
  font-size: 28px;
  margin: 0;
}

/* Show image / title placeholder */
#showInfo {
  display: flex;
  align-items: center;
  padding: 20px;
}

#showInfo img {
  width: auto;
  height: auto;
  max-width: 200px;  /* optional max size */
  max-height: 300px; /* optional max size */
  object-fit: contain; 
  margin-right: 20px;
  border-radius: 8px;
}

#showInfo .title {
  font-size: 24px;
  font-weight: bold;
}

/* Dropdowns */
select {
  font-size: 18px;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: rgba(128, 128, 128, 0.7);
  color: white;
  outline: none;
  cursor: pointer;
  width: 100%;
  max-width: 300px;
  margin-top: 5px;
}

select option {
  color: black;
}

/* Full-screen player container */
#playerContainer {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 9999;
}

#playerIframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* Back button */
#backBtn {
  position: absolute;
  top: 15px;
  left: 15px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  z-index: 10000;
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <img src="https://github.com/2321564369/shows/blob/main/bluey/Your_paragraph_text__1_-removebg-preview.png?raw=true" alt="Logo">
  <h1></h1>
</header>

<!-- SHOW IMAGE AND TITLE -->
<div id="showInfo">
  <img src="https://inoriginal.net/uploads/posts/2024-09/1726306639_logo.webp" alt="Show Image">
  <div class="title">Bluey</div>
</div>

<!-- SEASON AND EPISODE SELECTORS -->
<div style="padding: 0 20px 20px 20px;">
  <!-- Season Dropdown -->
  <div style="margin-bottom: 15px;">
    <label>Season:</label><br>
    <select id="seasonSelect" onchange="updateEpisodes()">
      <option value="">Select a season...</option>
      <option value="1">Season 1</option>
      <option value="2">Season 2</option>
      <option value="3">Season 3</option>
    </select>
  </div>

  <!-- Episode Dropdown -->
  <div>
    <label>Episode:</label><br>
    <select id="episodeSelect" onchange="openEpisode()" disabled>
      <option value="">Select a season first...</option>
    </select>
  </div>
</div>

<!-- FULL SCREEN PLAYER -->
<div id="playerContainer">
  <img id="backBtn" src="back.png" onclick="closePlayer()">
  <iframe id="playerIframe" allowfullscreen></iframe>
</div>

<script>
// Episodes per season
const episodesPerSeason = {
  1: 10, // Season 1
  2: 8,  // Season 2
  3: 12  // Season 3
};

const baseURL = "https://link.com/show"; // Replace with your URL

function updateEpisodes() {
  const season = document.getElementById("seasonSelect").value;
  const episodeSelect = document.getElementById("episodeSelect");
  episodeSelect.innerHTML = "";

  if (!season) {
    episodeSelect.disabled = true;
    episodeSelect.innerHTML = "<option>Select a season first...</option>";
    return;
  }

  episodeSelect.disabled = false;
  episodeSelect.innerHTML = "<option value=''>Select an episode...</option>";

  const totalEpisodes = episodesPerSeason[season];

  for (let i = 1; i <= totalEpisodes; i++) {
    const opt = document.createElement("option");
    opt.value = `${baseURL}/${season}/${i}`;
    opt.textContent = "Episode " + i;
    episodeSelect.appendChild(opt);
  }
}

function openEpisode() {
  const url = document.getElementById("episodeSelect").value;
  if (!url) return;

  document.getElementById("playerIframe").src = url;
  document.getElementById("playerContainer").style.display = "block";
}

function closePlayer() {
  document.getElementById("playerContainer").style.display = "none";
  document.getElementById("playerIframe").src = "";
  document.getElementById("episodeSelect").value = "";
}
</script>

</body>
</html>
