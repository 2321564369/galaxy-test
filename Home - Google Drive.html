<html lang="en" class="focus-outline-visible"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Games Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }

    header {
      padding: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin: 0;
      color: var(--accent);
    }

    header p {
      color: var(--muted);
      margin-top: .5rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem 3rem;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background: linear-gradient(180deg, #020617, #020617cc);
      border-radius: 1.25rem;
      padding: 1.25rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,.6);
    }

    .game-card h3 {
      margin: 0;
      font-size: 1.25rem;
    }

    .game-card p {
      margin: 0;
      font-size: .9rem;
      color: var(--muted);
      flex-grow: 1;
    }

    .game-card button {
      appearance: none;
      border: none;
      border-radius: .75rem;
      padding: .75rem 1rem;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: #020617;
      transition: filter .15s ease, transform .1s ease;
    }

    .game-card button:hover {
      filter: brightness(1.1);
    }

    .game-card button:active {
      transform: scale(.98);
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: .85rem;
    }
  </style>
</head>
<body>

<header>
  <h1>HTML Games Hub</h1>
  <p>Launch local HTML games or external game URLs in a clean sandboxed window</p>
</header>

<div class="container">
  <div class="games-grid" id="gamesGrid"></div>

  </div>


<footer>
  Add more games by copying a card and changing the function + URL.
</footer>

<script>
  /* =============================
     GAME FILE SYSTEM (EDIT THIS)
     ============================= */
  const FILE_SYSTEM = [
    {
      title: "Season 1 (52 Games)",
      folder: [
        {
          title: "Cookie Clicker",
          type: "game_url",
          action: "launchURLGame",
          file: "https://orteil.dashnet.org/cookieclicker/",
          id: "GameurlCookie"
        },
        {
          title: "Local Shooter",
          type: "file_url",
          action: "launchLocalGame",
          file: "games/local-shooter/index.html",
          id: "LocalShooter01"
        }
      ]
    }
  ];

  /* =============================
     UI GENERATION FROM FILE SYSTEM
     ============================= */
  document.addEventListener("DOMContentLoaded", () => {
  const grid = document.getElementById("gamesGrid");

  FILE_SYSTEM.forEach(section => {
    section.folder.forEach(game => {
      const card = document.createElement("div");
      card.className = "game-card";

      card.innerHTML = `
        <h3>${game.title}</h3>
        <p>Launch type: ${game.type}</p>
        <button id="${game.id}">Play</button>
      `;

      grid.appendChild(card);

      document.getElementById(game.id).addEventListener("click", () => {
        if (game.action === "launchLocalGame") {
          launchLocalGame(game.file);
        } else if (game.action === "launchURLGame") {
          launchURLGame(game.file);
        }
      });
    });
  });
});


  /* =============================
     WINDOW INJECT FUNCTION
     ============================= */
  function openTemplatePage(htmlContent) {
    const w = window.open("", "_blank");
    if (!w) {
      alert("Popup blocked! Please allow popups for this site.");
      return;
    }
    try {
      w.document.open();
      w.document.write(htmlContent);
      w.document.close();
    } catch (e) {
      const blob = new Blob([htmlContent], { type: "text/html" });
      w.location = URL.createObjectURL(blob);
    }
  }

  /* =============================
     LOCAL FILE GAME LAUNCHER
     ============================= */
  async function launchLocalGame(FILE_URL) {
    try {
      const response = await fetch(FILE_URL);
      const text = await response.text();

      const injectedHTML = `<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
</style></head><body>${text}</body></html>`;

      openTemplatePage(injectedHTML);
    } catch (err) {
      console.error(err);
      alert("Local game failed to load");
    }
  }

  /* =============================
     EXTERNAL URL GAME LAUNCHER
     ============================= */
  function launchURLGame(GAME_URL) {
    const injectedHTML = `<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;height:100%;background:#000}
iframe{border:0;width:100%;height:100%}
</style></head><body>
<iframe src="${GAME_URL}" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-fullscreen"></iframe>
</body></html>`;

    const w = window.open("", "_blank");
    if (!w) return alert("Popup blocked");

    try {
      w.document.open();
      w.document.write(injectedHTML);
      w.document.close();
    } catch {
      w.location = GAME_URL;
    }
  }
</script>



</body></html>
