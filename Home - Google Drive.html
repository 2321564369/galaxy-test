<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Full Screen Player</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
  }

  #playerContainer {
    display: none;
    width: 100vw;
    height: 100vh;
  }

  #playerIframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  #openBtn {
    padding: 20px 35px;
    font-size: 22px;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>

<button id="openBtn" onclick="openPlayer()">Open Player</button>

<div id="playerContainer">
  <iframe id="playerIframe"></iframe>
</div>

<script>
function openPlayer() {
  document.getElementById("playerIframe").src =
    "https://111movies.com/tv/82728/1/1";  // <--- put your video player URL here

  // Show the full-screen player
  document.getElementById("playerContainer").style.display = "block";

  // Hide the button
  document.getElementById("openBtn").style.display = "none";
}
</script>

</body>
</html>
