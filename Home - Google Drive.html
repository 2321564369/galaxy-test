<html><head>
<meta charset="UTF-8">
<title>Bluey</title>
<style>
/* Full page background with fade from left */
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  color: white;
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;

  /* Background image */
  background: url('https://assets-prd.ignimgs.com/2023/11/22/bluey-thumb-1700628294058.png') 
              no-repeat center center;
  background-size: cover;

  /* black fade overlay */
  background-image: 
    linear-gradient(
      to right,
      rgba(0,0,0,1) 0%,      /* Black */
      rgba(0,0,0,0.85) 20%,  /* Fade begins */
      rgba(0,0,0,0.55) 40%,  /* Mid fade */
      rgba(0,0,0,0.25) 60%,  /* Soft fade */
      rgba(0,0,0,0) 100%     /* Fully visible image */
    ),
    url('https://assets-prd.ignimgs.com/2023/11/22/bluey-thumb-1700628294058.png');
}



/* Header with logo */
header {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  background: rgba(0, 0, 0, 0.5);
}

header img {
  height: 50px;
  margin-right: 15px;
}

header h1 {
  font-size: 28px;
  margin: 0;
}

/* Show image / title placeholder */
#showInfo {
  display: flex;
  align-items: center;
  padding: 20px;
}

#showInfo img {
  width: auto;
  height: auto;
  max-width: 200px;  /* optional max size */
  max-height: 300px; /* optional max size */
  object-fit: contain; 
  margin-right: 20px;
  border-radius: 8px;
}

#showInfo .title {
  font-size: 24px;
  font-weight: bold;
}

/* Dropdowns */
select {
  font-size: 18px;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: rgba(128, 128, 128, 0.7);
  color: white;
  outline: none;
  cursor: pointer;
  width: 100%;
  max-width: 300px;
  margin-top: 5px;
}

select option {
  color: black;
}

/* Full-screen player container */
#playerContainer {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 9999;
}

#playerIframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* Back button */
#backBtn {
  position: absolute;
  top: 15px;
  left: 15px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  z-index: 10000;
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <img src="https://github.com/2321564369/shows/blob/main/bluey/Your_paragraph_text__1_-removebg-preview.png?raw=true" alt="Logo">
  <h1></h1>
</header>

<!-- SHOW IMAGE AND TITLE -->
<div id="showInfo">
  <img src="https://inoriginal.net/uploads/posts/2024-09/1726306639_logo.webp" alt="Show Image">
  <div class="title">Bluey</div>
</div>

<!-- SEASON AND EPISODE SELECTORS -->

  </div>
</div>

<div>CHOOSE SERVER CHARLIE FOR FHD</div><!-- FULL SCREEN PLAYER -->
<div id="playerContainer" style="display: none;">
  <img id="backBtn" src="back.png" onclick="closePlayer()">
  <iframe id="playerIframe" allowfullscreen="" src=""></iframe>
</div>

<script>
// Episodes per season
const episodesPerSeason = {
  1: 52, // Season 1
  2: 52,  // Season 2
  3: 50,  // Season 3
};

const baseURL = "https://111movies.com/tv/82728"; // Replace with your URL

function updateEpisodes() {
  const season = document.getElementById("seasonSelect").value;
  const episodeSelect = document.getElementById("episodeSelect");
  episodeSelect.innerHTML = "";

  if (!season) {
    episodeSelect.disabled = true;
    episodeSelect.innerHTML = "<option>Select a season first...</option>";
    return;
  }

  episodeSelect.disabled = false;
  episodeSelect.innerHTML = "<option value=''>Select an episode...</option>";

  const totalEpisodes = episodesPerSeason[season];

  for (let i = 1; i <= totalEpisodes; i++) {
    const opt = document.createElement("option");
    opt.value = `${baseURL}/${season}/${i}`;
    opt.textContent = "Episode " + i;
    episodeSelect.appendChild(opt);
  }
}

function openEpisode() {
  const url = document.getElementById("episodeSelect").value;
  if (!url) return;

  document.getElementById("playerIframe").src = url;
  document.getElementById("playerContainer").style.display = "block";
}

function closePlayer() {
  document.getElementById("playerContainer").style.display = "none";
  document.getElementById("playerIframe").src = "";
  document.getElementById("episodeSelect").value = "";
}
</script>
</body></html>
