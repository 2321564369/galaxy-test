<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Player With Episode Dropdown</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  #playerContainer {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 9999;
  }

  #playerIframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* BACK BUTTON */
  #backBtn {
    position: absolute;
    top: 15px;
    left: 15px;
    width: 40px;
    height: 40px;
    cursor: pointer;
    z-index: 10000;
  }

  /* EPISODE DROPDOWN */
  #episodeSelect {
    font-size: 20px;
    padding: 10px 15px;
  }
</style>
</head>
<body>

<!-- LABELED DROPDOWN -->
<label for="episodeSelect" style="font-size:22px;">Choose Episode:</label>
<select id="episodeSelect" onchange="openEpisode()">
  <option value="">Select an episode...</option>
  <option value="https://111movies.com/tv/82728/1/1">Episode 1</option>
  <option value="https://111movies.com/tv/82728/1/2">Episode 2</option>
  <option value="https://111movies.com/tv/82728/1/3">Episode 3</option>
</select>

<!-- FULL SCREEN PLAYER -->
<div id="playerContainer">
  <img id="backBtn" src="back.png" onclick="closePlayer()">
  <iframe id="playerIframe" allowfullscreen></iframe>
</div>

<script>
function openEpisode() {
  let url = document.getElementById("episodeSelect").value;

  if (url === "") return; // nothing selected

  document.getElementById("playerIframe").src = url;

  document.getElementById("playerContainer").style.display = "block";
}

function closePlayer() {
  document.getElementById("playerContainer").style.display = "none";
  document.getElementById("playerIframe").src = "";
  document.getElementById("episodeSelect").value = "";
}
</script>

</body>
</html>
