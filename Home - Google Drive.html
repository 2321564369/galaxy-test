<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Responsive Player</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  #playerContainer {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 9999;
  }

  #playerIframe {
    border: none;
    width: 100%;
    height: 100%;
  }

  /* BACK BUTTON IMAGE */
  #backBtn {
    position: absolute;
    top: 15px;
    left: 15px;
    width: 40px;
    height: 40px;
    cursor: pointer;
    z-index: 10000;
  }

  #openBtn {
    padding: 20px 30px;
    font-size: 20px;
  }
</style>
</head>
<body>

<button id="openBtn" onclick="openPlayer()">Open Player</button>

<div id="playerContainer">
  <!-- BACK BUTTON IMAGE -->
  <img id="backBtn" src="back.png" onclick="closePlayer()">
  
  <iframe id="playerIframe" allowfullscreen></iframe>
</div>

<script>
function openPlayer() {
  document.getElementById("playerIframe").src =
    "https://111movies.com/tv/82728/1/1"; // <-- replace with your player URL

  document.getElementById("playerContainer").style.display = "block";
  document.getElementById("openBtn").style.display = "none";
}

function closePlayer() {
  document.getElementById("playerContainer").style.display = "none";
  document.getElementById("playerIframe").src = "";
  document.getElementById("openBtn").style.display = "inline-block";
}
</script>

</body>
</html>
