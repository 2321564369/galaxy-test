<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Responsive Player</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  #playerContainer {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
  }

  #playerIframe {
    border: none;
    width: 100%;
    height: 100%;
  }

  #openBtn {
    padding: 20px 30px;
    font-size: 20px;
  }
</style>
</head>
<body>

<button id="openBtn" onclick="openPlayer()">Open Player</button>

<div id="playerContainer">
  <iframe id="playerIframe" allowfullscreen></iframe>
</div>

<script>
function openPlayer() {
  document.getElementById("playerIframe").src =
    "https://111movies.com/tv/82728/1/1"; // <-- your player URL

  document.getElementById("playerContainer").style.display = "block";
  document.getElementById("openBtn").style.display = "none";
}
</script>

</body>
</html>
