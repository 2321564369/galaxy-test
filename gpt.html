<div class="container">
 <!-- MathJax for fractions & math -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<div id="chat-container" style="
  max-width: 700px;
  margin: 40px auto;
  font-family: 'Inter', sans-serif;
  background: url('https://starwalk.space/gallery/images/what-is-space/1140x641.jpg') center/cover no-repeat;
  border-radius: 16px;
  padding: 20px;
  color: white;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
">
  <h2 style="text-align:center; font-weight:700; text-shadow:0 0 8px rgba(0,0,0,0.6);">
    🚀 GALAXY GPT 🚀
  </h2>

  <div id="chatbox" style="
    background: rgba(0,0,0,0.4);
    border-radius: 12px;
    padding: 20px;
    height: 400px;
    overflow-y: auto;
    margin-top: 10px;
  "></div>

  <div style="display:flex; margin-top:15px; gap:8px;">
    <input id="userInput" type="text" placeholder="Type your message..." style="flex:1; padding:12px; border:none; border-radius:8px; outline:none;
      background: rgba(255,255,255,0.2); color:white; font-size:15px;">
    <button id="sendButton" onclick="sendMessage()" style="
      background:#9b59b6;
      color:white;
      border:none;
      padding:12px 18px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;

    " onmouseover="this.style.background='#8e44ad'" onmouseout="this.style.background='#9b59b6'">
      Send
    </button>
    <button id="clearButton" onclick="clearChat()" style="
      background:rgba(255,255,255,0.2);
      color:white;
      border:1px solid rgba(255,255,255,0.3);

      border-radius:8px;

      font-weight:600;
      transition:0.3s;
    " onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">
      🧹 Clear
    </button>
  </div>
</div>

<script>
/* ==============================
   🔑 API KEY
============================== */
const API_KEY = "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"; // Replace this

/* ==============================
   EVENT HANDLERS
============================== */
document.getElementById("userInput").addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
});

function clearChat() {
  document.getElementById("chatbox").innerHTML = "";
}

/* ==============================
   HELPERS
============================== */
function escapeHTML(str) {
  return str
    ? str.replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
    : "";
}

/* --- Code block formatting --- */
function formatCodeBlocks(text) {
  return text.replace(/```([\s\S]*?)```/g, (match, code) => `
    <pre style="
      background: rgba(255,255,255,0.15);
      color: #00ffb3;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      white-space: pre-wrap;
    "><code>${escapeHTML(code)}</code></pre>
  `);
}

/* --- Markdown-like formatting (headings, lists, breaks) --- */
function formatMarkdown(text) {
  text = text.replace(/^#### (.*)$/gm, '<h4 style="margin:6px 0;">$1</h4>');
  text = text.replace(/^### (.*)$/gm, '<h3 style="margin:8px 0;">$1</h3>');
  text = text.replace(/^## (.*)$/gm, '<h2 style="margin:10px 0;">$1</h2>');
  text = text.replace(/^# (.*)$/gm, '<h1 style="margin:12px 0;">$1</h1>');
  text = text.replace(/(^[-*] .*(\n[-*] .*)*)/gm, match => {
    const items = match.split(/\n/).map(line => line.replace(/^[-*] /, '').trim());
    return `<ul style="margin:4px 0 8px 20px;">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
  });
  text = text.replace(/\n/g, "<br>");
  return text;
}

/* --- Detect if message wants an image --- */
function isImageRequest(message) {
  const keywords = [
    "image", "picture", "photo", "draw", "illustrate", "generate",
    "paint", "sketch", "art", "render", "scene", "design"
  ];
  return keywords.some(k => message.toLowerCase().includes(k));
}

/* ==============================
   MAIN CHAT FUNCTION
============================== */
async function sendMessage() {
  const input = document.getElementById("userInput");
  const chatbox = document.getElementById("chatbox");
  const userMessage = input.value.trim();
  if (!userMessage) return;

  // Add user message
  chatbox.innerHTML += `
    <div style="margin-bottom:10px; text-align:right;">
      <div style="display:inline-block; background:rgba(255,255,255,0.2);
        padding:10px 14px; border-radius:12px; color:#fff; max-width:80%;">
        <b>You:</b> ${escapeHTML(userMessage)}
      </div>
    </div>`;
  input.value = "";
  chatbox.scrollTop = chatbox.scrollHeight;

  // Add loading animation
  const loadingId = "loading-" + Date.now();
  chatbox.innerHTML += `
    <div id="${loadingId}" style="margin-bottom:10px; text-align:left;">
      <div style="display:inline-block; background:rgba(255,255,255,0.25);
        padding:10px 14px; border-radius:12px; max-width:80%;">
        <b>GPT:</b>
        <img src="https://www.ilportaleofferte.it/portaleOfferte/resources/static/img/gif_loading.gif"
        alt="loading" style="width:25px; vertical-align:middle;">
      </div>
    </div>`;
  chatbox.scrollTop = chatbox.scrollHeight;

  try {
    let reply = "";
    if (isImageRequest(userMessage)) {
      reply = "⚠️ Image generation is not available on the free plan.";
    } else {
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [{ role: "user", content: userMessage }]
        })
      });

      const data = await response.json();
      reply = data.choices?.[0]?.message?.content || "⚠️ No response.";
      reply = escapeHTML(reply);
      reply = formatCodeBlocks(reply);
      reply = formatMarkdown(reply);
    }

    document.getElementById(loadingId)?.remove();

    // Add GPT reply
    chatbox.innerHTML += `
      <div style="margin-bottom:10px; text-align:left;">
        <div style="display:inline-block; background:rgba(255,255,255,0.25);
          padding:10px 14px; border-radius:12px; color:#fff; max-width:80%;">
          <b>GPT:</b> ${reply}
        </div>
      </div>`;
    chatbox.scrollTop = chatbox.scrollHeight;

    if (window.MathJax) MathJax.typesetPromise();

  } catch (err) {
    document.getElementById(loadingId)?.remove();
    chatbox.innerHTML += `<div style="color:red;">Error: ${err.message}</div>`;
  }
}
</script>
