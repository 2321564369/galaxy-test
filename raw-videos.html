<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bluey</title>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  color: white;
  overflow-x: hidden;
}

/* Background + black left fade */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;

  background:
    linear-gradient(
      to right,
      rgba(0,0,0,1) 0%,
      rgba(0,0,0,0.85) 20%,
      rgba(0,0,0,0.55) 40%,
      rgba(0,0,0,0.25) 60%,
      rgba(0,0,0,0) 100%
    ),
    url('https://assets-prd.ignimgs.com/2023/11/22/bluey-thumb-1700628294058.png') no-repeat center center fixed;

  background-size: cover;
}

/* Header */
header {
  display: flex;
  align-items: center;
  padding: 10px 20px;
}

header img {
  height: 50px;
  margin-right: 15px;
}

/* Show info */
#showInfo {
  display: flex;
  align-items: center;
  padding: 20px;
}

#showInfo img {
  width: 120px;
  height: auto;
  border-radius: 8px;
  margin-right: 20px;
}

#showInfo .title {
  font-size: 28px;
  font-weight: bold;
}

/* Dropdowns */
select {
  font-size: 18px;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: rgba(128,128,128,0.7);
  color: white;
  outline: none;
  cursor: pointer;
  width: 100%;
  max-width: 300px;
  margin-top: 5px;
}

select option {
  color: black;
}

/* Fullscreen video player */
#playerContainer {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 9999;
}

#videoPlayer {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

/* Back button */
#backBtn {
  position: absolute;
  top: 15px;
  left: 15px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  z-index: 10000;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <img src="https://github.com/2321564369/shows/blob/main/bluey/Your_paragraph_text__1_-removebg-preview.png?raw=true">
</header>

<!-- SHOW IMAGE + TITLE -->
<div id="showInfo">
  <img src="https://inoriginal.net/uploads/posts/2024-09/1726306639_logo.webp">
  <div class="title">Bluey</div>
</div>

<!-- SEASON + EPISODE SELECTORS -->
<div style="padding: 20px;">

  <!-- Season -->
  <label>Season:</label><br>
  <select id="seasonSelect" onchange="updateEpisodes()">
    <option value="">Select a season...</option>
    <option value="1">Season 1</option>
    <option value="2">Season 2</option>
    <option value="3">Season 3</option>
  </select>

  <br><br>

  <!-- Episode -->
  <label>Episode:</label><br>
  <select id="episodeSelect" onchange="openVideo()" disabled>
    <option value="">Select a season first...</option>
  </select>

</div>

<!-- VIDEO PLAYER FULLSCREEN -->
<div id="playerContainer">
  <img id="backBtn" src="back.png" onclick="closePlayer()">
  <video id="videoPlayer" controls></video>
</div>

<script>
/* RAW VIDEO LINKS: PUT REAL MP4 / M3U8 LINKS HERE */
const videoFiles = {
  1: { // SEASON 1
    1: "https://example.com/s1e1.mp4",
    2: "https://example.com/s1e2.mp4",
    3: "https://example.com/s1e3.mp4",
    4: "https://example.com/s1e4.mp4",
    5: "https://example.com/s1e5.mp4"
  },
  2: { // SEASON 2
    1: "https://example.com/s2e1.mp4",
    2: "https://example.com/s2e2.mp4",
    3: "https://example.com/s2e3.mp4"
  },
  3: { // SEASON 3
    1: "https://example.com/s3e1.mp4",
    2: "https://example.com/s3e2.mp4",
    3: "https://example.com/s3e3.mp4"
  }
};

/* UPDATE EPISODES WHEN SEASON CHANGES */
function updateEpisodes() {
  const season = document.getElementById("seasonSelect").value;
  const epSelect = document.getElementById("episodeSelect");
  epSelect.innerHTML = "";

  if (!season) {
    epSelect.disabled = true;
    epSelect.innerHTML = "<option>Select a season first...</option>";
    return;
  }

  epSelect.disabled = false;
  epSelect.innerHTML = "<option value=''>Select an episode...</option>";

  const eps = videoFiles[season];
  for (const ep in eps) {
    const option = document.createElement("option");
    option.value = eps[ep];
    option.textContent = "Episode " + ep;
    epSelect.appendChild(option);
  }
}

/* OPEN RAW VIDEO FILE */
function openVideo() {
  const url = document.getElementById("episodeSelect").value;
  if (!url) return;

  const video = document.getElementById("videoPlayer");

  video.src = url;
  video.load();
  video.play();

  document.getElementById("playerContainer").style.display = "block";
}

/* CLOSE PLAYER */
function closePlayer() {
  const video = document.getElementById("videoPlayer");

  document.getElementById("playerContainer").style.display = "none";
  video.pause();
  video.src = "";

  document.getElementById("episodeSelect").value = "";
}
</script>

</body>
</html>
